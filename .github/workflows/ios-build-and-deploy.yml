# ========================================
# iOS 빌드 및 TestFlight 배포 워크플로우
# ========================================
# 
# ⚠️  중요: EAS Build 사용 불가로 인해 순수 GitHub Actions 사용
# 
# 문제 상황:
# - EAS Build에서 Firebase + Google Ads + Expo 조합 시 빌드 실패
# - Config Plugin으로 해결 시도했으나 계속 에러 발생
# - 따라서 순수 Xcode 빌드 방식으로 전환
#
# 빌드 과정:
# 1. Expo prebuild로 iOS 프로젝트 생성
# 2. CocoaPods로 의존성 설치
# 3. Apple 계정 로그인 및 키체인 설정
# 4. xcodebuild로 직접 빌드 및 아카이브
# 5. IPA 내보내기 및 TestFlight 업로드
#
# 필요한 GitHub Secrets:
# - EXPO_TOKEN: Expo 계정 토큰
# - APPLE_ID: Apple Developer 계정 이메일
# - APPLE_APP_SPECIFIC_PASSWORD: 앱별 비밀번호
# - APPLE_TEAM_ID: Apple Developer 팀 ID
# - APP_STORE_CONNECT_APP_ID: App Store Connect 앱 ID
# - IOS_CERTIFICATE: iOS 개발자 인증서 (.p12 파일을 base64로 인코딩)
# - CERTIFICATE_PASSWORD: 인증서 비밀번호
# - IOS_PROVISIONING_PROFILE: 프로비저닝 프로파일 (.mobileprovision 파일을 base64로 인코딩)
# - PROVISIONING_PROFILE_NAME: 프로비저닝 프로파일 이름
# - CODE_SIGN_IDENTITY: 코드 서명 인증서 이름 (예: "iPhone Developer: Your Name")
# ========================================

name: iOS Build and Deploy to TestFlight

on:
  push:
    branches: [main, release]
  workflow_dispatch: # 수동 실행 가능

jobs:
  ios-build-and-deploy:
    runs-on: macos-latest
    
    steps:
      # 1단계: 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
        
      # 2단계: Node.js 환경 설정 (npm 캐시 사용으로 빌드 속도 향상)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      # 3단계: 의존성 설치 (legacy-peer-deps로 충돌 해결)
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        
      # 4단계: Expo CLI 설정 (EAS Build 대신 순수 Expo 사용)
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          
      # 5단계: iOS 프로젝트 생성 (EAS Build 없이 순수 prebuild 사용)
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean
        
      # 6단계: CocoaPods 의존성 설치
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          
      # 7단계: Apple 계정 로그인 및 Xcode 계정 설정
      - name: Setup Apple Account
        run: |
          # 키체인 생성 및 설정
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # Apple 계정 로그인
          echo "🔐 Apple 계정 로그인 중..."
          xcrun altool --list-providers -u "${{ secrets.APPLE_ID }}" -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
          
          # Xcode 계정 설정 (자동 서명을 위해 필수)
          echo "📱 Xcode 계정 설정 중..."
          
          # Apple 계정을 Xcode에 추가하는 시도
          echo "🔑 Apple 계정을 Xcode에 추가 시도..."
          xcrun altool --upload-app -f /dev/null -u "${{ secrets.APPLE_ID }}" -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" --verbose || echo "⚠️ 업로드 테스트 실패 (정상)"
          
          # 프로비저닝 프로파일 자동 생성 시도
          echo "📋 프로비저닝 프로파일 생성 시도..."
          xcrun altool --list-providers -u "${{ secrets.APPLE_ID }}" -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" --output-format json || echo "⚠️ 프로바이더 목록 조회 실패"
          
          # 인증서 확인
          echo "📋 설치된 인증서 확인:"
          security find-identity -v -p codesigning
          
          # Xcode 계정 설정 파일 생성 시도
          echo "🔧 Xcode 계정 설정 파일 생성 시도..."
          mkdir -p ~/Library/Developer/Xcode/UserData
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>AppleID</key>
              <string>${{ secrets.APPLE_ID }}</string>
              <key>TeamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>' > ~/Library/Developer/Xcode/UserData/IDEFindNavigatorScopes.plist || echo "⚠️ 설정 파일 생성 실패"
          
      # 8단계: Xcode 빌드 및 아카이브 (자동 서명 방식)
      - name: Build iOS
        run: |
          cd ios
          echo "🔨 iOS 빌드 시작 (자동 서명 방식)..."
          echo "🏢 팀 ID: ${{ secrets.APPLE_TEAM_ID }}"
          
          # 자동 서명으로 빌드 (더 강력한 설정)
          xcodebuild -workspace PickPlay.xcworkspace -scheme PickPlay -configuration Release -destination generic/platform=iOS -archivePath PickPlay.xcarchive archive -allowProvisioningUpdates -allowProvisioningDeviceRegistration DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic
          
      # 9단계: IPA 파일 내보내기 (자동 서명 방식)
      - name: Export IPA
        run: |
          cd ios
          echo "📦 IPA 파일 내보내기 중..."
          
          # 자동 서명으로 IPA 내보내기
          xcodebuild -exportArchive -archivePath PickPlay.xcarchive -exportPath . -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic
          
      # 10단계: TestFlight 자동 업로드
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ios/PickPlay.ipa
          issuer-id: ${{ secrets.APPLE_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_APP_ID }}
          api-private-key: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          
      # 빌드 결과 확인 및 상태 보고
      - name: Build Status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ iOS 빌드 및 TestFlight 제출 성공!"
            echo "📱 TestFlight에서 앱을 확인하세요: https://appstoreconnect.apple.com"
          else
            echo "❌ iOS 빌드 또는 TestFlight 제출 실패"
            echo "🔍 GitHub Actions 로그를 확인하여 문제를 해결하세요"
            exit 1
          fi
