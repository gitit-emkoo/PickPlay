# ========================================
# iOS 빌드 및 TestFlight 배포 워크플로우
# ========================================
# 
# ⚠️  중요: EAS Build 사용 불가로 인해 순수 GitHub Actions 사용
# 
# 문제 상황:
# - EAS Build에서 Firebase + Google Ads + Expo 조합 시 빌드 실패
# - Config Plugin으로 해결 시도했으나 계속 에러 발생
# - 따라서 순수 Xcode 빌드 방식으로 전환
#
# 빌드 과정:
# 1. Expo prebuild로 iOS 프로젝트 생성
# 2. CocoaPods로 의존성 설치
# 3. Fastlane으로 인증서 및 프로파일 설정
# 4. Fastlane으로 빌드 및 TestFlight 업로드
#
# 필요한 GitHub Secrets:
# - EXPO_TOKEN: Expo 계정 토큰
# - APPLE_ID: Apple Developer 계정 이메일
# - APPLE_APP_SPECIFIC_PASSWORD: 앱별 비밀번호
# - APPLE_TEAM_ID: Apple Developer 팀 ID
# - APP_STORE_CONNECT_APP_ID: App Store Connect 앱 ID
# - P12_BASE64_PART1: iOS Distribution 인증서 Base64 문자열 (0-1999자)
# - P12_BASE64_PART2: iOS Distribution 인증서 Base64 문자열 (2000-3999자)
# - P12_BASE64_PART3: iOS Distribution 인증서 Base64 문자열 (4000자 이후)
# - P12_PASSWORD: .p12 파일의 비밀번호
# - IOS_PROVISIONING_PROFILE: App Store 프로비저닝 프로파일 (.mobileprovision 파일을 base64로 인코딩)
# ========================================

name: iOS Build and Deploy to TestFlight

on:
  push:
    branches: [main, release]
  workflow_dispatch: # 수동 실행 가능

jobs:
  ios-build-and-deploy:
    runs-on: macos-latest
    
    steps:
      # 1단계: 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
        
      # 2단계: Node.js 환경 설정 (npm 캐시 사용으로 빌드 속도 향상)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      # 3단계: 의존성 설치 (npm ci로 정확한 버전 보장, peer dependency 충돌 해결)
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        
      # 4단계: Expo CLI 설치 및 설정
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          
      # 5단계: Xcode 버전 설정 및 iOS 프로젝트 생성
      - name: Setup Xcode and Prebuild iOS
        run: |
          # Xcode 16.3 사용 (호환성 문제 해결)
          sudo xcode-select -s /Applications/Xcode_16.3.app
          xcodebuild -version
          
          # iOS 프로젝트 생성
          npx expo prebuild --platform ios --clean
        
      # 6단계: CocoaPods 의존성 설치 및 SwiftLint 설정
      - name: Install CocoaPods and SwiftLint
        run: |
          cd ios
          # 기존 Pods 캐시 정리 (더 강력한 정리)
          rm -rf Pods/
          rm -f Podfile.lock
          rm -rf build/
          rm -rf DerivedData/
          
          # 새로 설치
          pod install --repo-update
          
          # SwiftLint 설치 (성공 사례에서 권장)
          echo "🔍 SwiftLint 설치 중..."
          brew install swiftlint
          
          # SwiftLint 실행 (코드 품질 검사) - 설정 파일 사용
          echo "🔍 SwiftLint 코드 품질 검사 중..."
          swiftlint --config .swiftlint.yml || echo "⚠️ SwiftLint 경고가 있지만 계속 진행합니다."
          
      # 7단계: Fastlane 설치 및 설정 복원 (성공 사례 방식 적용)
      - name: Setup Fastlane
        run: |
          echo "🚀 Fastlane 설치 중..."
          sudo gem install fastlane
          
          echo "📋 성공 사례 방식으로 파일 복원 중..."
          # 간단한 bash 스크립트로 파일 복원 (zx 대신)
          mkdir -p ios/fastlane
          cp fastlane-template.rb ios/fastlane/Fastfile
          cp export-options-template.plist ios/ExportOptions.plist
          
          # 파일 권한 설정 (성공 사례에서 중요하게 언급됨)
          chmod +x ios/fastlane/Fastfile
          chmod 644 ios/ExportOptions.plist
          
          echo "✅ 파일 복원 완료!"
          
      # 8단계: Fastlane 설정 확인
      - name: Verify Fastlane Setup
        run: |
          echo "🔧 Fastlane 설정 확인 중..."
          
          # 현재 디렉토리 확인
          echo "📁 현재 디렉토리: $(pwd)"
          echo "📁 디렉토리 내용:"
          ls -la
          
          # ios 디렉토리 확인
          echo "📁 ios 디렉토리 내용:"
          ls -la ios/
          
          # fastlane 디렉토리 확인
          echo "📁 ios/fastlane 디렉토리 내용:"
          ls -la ios/fastlane/ || echo "fastlane 디렉토리가 없습니다"
          
          # Fastfile 존재 확인
          if [ -f "ios/fastlane/Fastfile" ]; then
            echo "✅ Fastfile이 존재합니다."
            echo "📋 Fastfile 내용 확인:"
            head -10 ios/fastlane/Fastfile
          else
            echo "❌ Fastfile이 없습니다. 저장소에 추가해야 합니다."
            exit 1
          fi
          
          cd ios
          
      # 9단계: 인증서 및 프로파일 준비
      - name: Prepare Certificates and Profiles
        run: |
          echo "📋 인증서 및 프로파일 준비 중..."
          
          # 1. Base64 문자열 병합
          printf "%s%s%s" "${{ secrets.P12_BASE64_PART1 }}" "${{ secrets.P12_BASE64_PART2 }}" "${{ secrets.P12_BASE64_PART3 }}" > certificate_merged.b64
          
          # 2. Base64 디코딩
          base64 -D -i certificate_merged.b64 -o certificate.p12
          
          # 3. 프로비저닝 프로파일 디코딩
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 -D > provisioning_profile.mobileprovision
          
          # 4. 파일 확인
          echo "📁 생성된 파일들:"
          ls -la certificate.p12 provisioning_profile.mobileprovision
          
      # 10단계: Fastlane으로 빌드 및 배포
      - name: Build and Deploy with Fastlane
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "🚀 Fastlane으로 빌드 및 배포 시작..."
          cd ios
          
          # 비밀번호 정제 (더 강력한 정제)
          export CLEAN_PASSWORD=$(printf '%s' "$P12_PASSWORD" | sed 's/[[:space:]]*$//' | tr -d '\n\r\t ' | sed 's/[^[:print:]]//g')
          export P12_PASSWORD="$CLEAN_PASSWORD"
          
          echo "🔍 정제된 비밀번호 길이: ${#CLEAN_PASSWORD}"
          echo "🔍 비밀번호 첫 3자: ${CLEAN_PASSWORD:0:3}***"
          
          # Fastlane beta lane 실행
          fastlane beta
          
          echo "✅ 빌드 및 TestFlight 업로드 완료!"
          
      # 11단계: 빌드 상태 확인 (에러 처리)
      - name: Build Status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ 빌드 성공! TestFlight에 업로드되었습니다."
          else
            echo "❌ 빌드 실패! 로그를 확인해주세요."
            exit 1
          fi