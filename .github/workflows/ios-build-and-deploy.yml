# ========================================
# iOS 빌드 및 TestFlight 배포 워크플로우
# ========================================
# 
# ⚠️  중요: EAS Build 사용 불가로 인해 순수 GitHub Actions 사용
# 
# 문제 상황:
# - EAS Build에서 Firebase + Google Ads + Expo 조합 시 빌드 실패
# - Config Plugin으로 해결 시도했으나 계속 에러 발생
# - 따라서 순수 Xcode 빌드 방식으로 전환
#
# 빌드 과정:
# 1. Expo prebuild로 iOS 프로젝트 생성
# 2. CocoaPods로 의존성 설치
# 3. 수동 서명을 위한 인증서 및 프로파일 설정
# 4. xcodebuild로 직접 빌드 및 아카이브
# 5. IPA 내보내기 및 TestFlight 업로드
#
# 필요한 GitHub Secrets:
# - EXPO_TOKEN: Expo 계정 토큰
# - APPLE_ID: Apple Developer 계정 이메일
# - APPLE_APP_SPECIFIC_PASSWORD: 앱별 비밀번호
# - APPLE_TEAM_ID: Apple Developer 팀 ID
# - APP_STORE_CONNECT_APP_ID: App Store Connect 앱 ID
# - P12_BASE64_PART1: iOS Distribution 인증서 Base64 문자열 (0-1999자)
# - P12_BASE64_PART2: iOS Distribution 인증서 Base64 문자열 (2000-3999자)
# - P12_BASE64_PART3: iOS Distribution 인증서 Base64 문자열 (4000자 이후)
# - P12_PASSWORD: .p12 파일의 비밀번호
# - IOS_PROVISIONING_PROFILE: App Store 프로비저닝 프로파일 (.mobileprovision 파일을 base64로 인코딩)
# ========================================

name: iOS Build and Deploy to TestFlight

on:
  push:
    branches: [main, release]
  workflow_dispatch: # 수동 실행 가능

jobs:
  ios-build-and-deploy:
    runs-on: macos-latest
    
    steps:
      # 1단계: 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
        
      # 2단계: Node.js 환경 설정 (npm 캐시 사용으로 빌드 속도 향상)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      # 3단계: 의존성 설치 (npm ci로 정확한 버전 보장, peer dependency 충돌 해결)
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        
      # 4단계: Expo CLI 설치 및 설정
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          
      # 5단계: iOS 프로젝트 생성 (prebuild)
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean
        
      # 6단계: CocoaPods 의존성 설치
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          
      # 7단계: 수동 서명을 위한 인증서 및 프로파일 설정
      - name: Setup Manual Code Signing
        run: |
          # 인증서 (.p12) 설치 - 분할된 Secret 사용
          echo "🔐 iOS 인증서 설치 중..."
          
          # 1. Base64 문자열을 병합합니다. (printf가 echo -n보다 더 안전합니다.)
          # %s: 문자열을 그대로 출력, >: 파일 생성
          printf "%s%s%s" "${{ secrets.P12_BASE64_PART1 }}" "${{ secrets.P12_BASE64_PART2 }}" "${{ secrets.P12_BASE64_PART3 }}" > certificate_merged.b64
          
          # 2. Base64 디코딩 (macOS 호환)
          base64 -D -i certificate_merged.b64 -o certificate_original.p12
          
          # 3. OpenSSL로 인증서 재생성 (호환성 개선)
          echo "📋 OpenSSL로 인증서 재생성 중..."
          
          # 원본 인증서에서 개인키와 인증서 추출 시도
          echo "📋 원본 인증서에서 PEM 추출 시도"
          openssl pkcs12 -in certificate_original.p12 -out temp_cert.pem -nodes -passin pass:"${{ secrets.P12_PASSWORD }}" || {
            echo "📋 원본 비밀번호로 추출 실패, 정제된 비밀번호로 재시도"
            CLEAN_PASS=$(printf '%s' "${{ secrets.P12_PASSWORD }}" | sed 's/[[:space:]]*$//' | tr -d '\n\r\t ')
            openssl pkcs12 -in certificate_original.p12 -out temp_cert.pem -nodes -passin pass:"$CLEAN_PASS" || {
              echo "📋 PEM 추출 실패, 원본 인증서 그대로 사용"
              cp certificate_original.p12 certificate.p12
              SKIP_RECREATION=true
            }
          }
          
          # 원본 인증서 그대로 사용 (재생성 시 Unknown format 오류 발생)
          echo "📋 원본 인증서 그대로 사용 (재생성 시 Unknown format 오류 발생)"
          cp certificate_original.p12 certificate.p12
          
          echo "📋 재생성된 인증서 파일 크기: $(ls -la certificate.p12)"
          
          # 인증서 파일 검증
          echo "📋 인증서 파일 크기: $(ls -la certificate.p12)"
          echo "📋 인증서 파일 타입: $(file certificate.p12)"
          echo "📋 인증서 파일 hexdump (처음 32바이트):"
          head -c 32 certificate.p12 | hexdump -C
          
          # 4. 비밀번호 확인 (원본 인증서 사용 시 더 강력한 정제 필요)
          echo "📋 원본 비밀번호: ${{ secrets.P12_PASSWORD }}"
          
          # 여러 방법으로 비밀번호 정제
          CLEAN_PASSWORD1=$(printf '%s' "${{ secrets.P12_PASSWORD }}" | sed 's/[[:space:]]*$//' | tr -d '\n\r\t ')
          CLEAN_PASSWORD2=$(printf '%s' "${{ secrets.P12_PASSWORD }}" | tr -d '[:space:]')
          CLEAN_PASSWORD3=$(printf '%s' "${{ secrets.P12_PASSWORD }}" | perl -pe 's/\s+$//')
          
          echo "📋 정제된 비밀번호들 준비 완료"
          
          # 4. 키체인 생성 (임시 비밀번호 사용)
          security create-keychain -p "temp123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp123" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # 5. 원본 인증서로 가져오기 시도 (여러 비밀번호로)
          echo "📋 원본 인증서로 가져오기 시도 (여러 비밀번호로)"
          security import certificate.p12 -k build.keychain -P "$CLEAN_PASSWORD1" -A -T /usr/bin/codesign || {
            echo "📋 방법 1 실패, 방법 2로 시도"
            security import certificate.p12 -k build.keychain -P "$CLEAN_PASSWORD2" -A -T /usr/bin/codesign || {
              echo "📋 방법 2 실패, 방법 3으로 시도"
              security import certificate.p12 -k build.keychain -P "$CLEAN_PASSWORD3" -A -T /usr/bin/codesign || {
                echo "📋 방법 3 실패, 원본 비밀번호로 시도"
                security import certificate.p12 -k build.keychain -P "${{ secrets.P12_PASSWORD }}" -A -T /usr/bin/codesign || {
                  echo "❌ 모든 방법 실패!"
                  exit 1
                }
              }
            }
          }
          
          echo "✅ 인증서 설치 완료!"
          
          # 프로비저닝 프로파일 설치
          echo "📋 프로비저닝 프로파일 설치 중..."
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 -D > provisioning_profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp provisioning_profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          
          # 인증서 확인
          echo "📋 설치된 인증서 확인:"
          security find-identity -v -p codesigning
          
          # 프로비저닝 프로파일 확인
          echo "📋 설치된 프로비저닝 프로파일 확인:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          
      # 8단계: iOS 빌드 및 아카이브
      - name: Build iOS
        run: |
          cd ios
          xcodebuild -workspace PickPlay.xcworkspace -scheme PickPlay -configuration Release -destination generic/platform=iOS -archivePath PickPlay.xcarchive archive -allowProvisioningUpdates DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_IDENTITY="iPhone Distribution" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="*[expo]*com.pickplay.kwcc*App Store*"
          
      # 9단계: IPA 내보내기
      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive -archivePath PickPlay.xcarchive -exportPath . -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_IDENTITY="iPhone Distribution" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="*[expo]*com.pickplay.kwcc*App Store*"
          
      # 10단계: TestFlight 업로드
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ios/PickPlay.ipa
          issuer-id: ${{ secrets.APPLE_ID }}
          api-key-id: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_APP_ID }}
          
      # 11단계: 빌드 상태 확인 (에러 처리)
      - name: Build Status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ 빌드 성공! TestFlight에 업로드되었습니다."
          else
            echo "❌ 빌드 실패! 로그를 확인해주세요."
            exit 1
          fi