name: iOS Beta (Fastlane)

on:
  push:
    branches: [main, release]
  workflow_dispatch:

jobs:
  ios-beta:
    runs-on: macos-14
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Setup Node.js (cache lockfile anywhere)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      # p8 내용을 파일로 저장 → Fastlane에서 key_filepath로 사용
      - name: Write App Store Connect API key to file
        env:
          ASC_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_P8" > "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV

      - name: Setup Ruby & tools
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Fastlane/CocoaPods/xcodeproj
        run: |
          gem install fastlane --no-document
          gem install cocoapods --no-document
          gem install xcodeproj --no-document

      # 프로젝트 디렉토리: pickplay
      - name: Detect project dir
        run: |
          if [ -f ./pickplay/ios/Podfile ]; then
            echo "PROJ_DIR=pickplay" >> $GITHUB_ENV
          elif [ -f ./ios/Podfile ]; then
            echo "PROJ_DIR=." >> $GITHUB_ENV
          else
            echo "::error::ios/Podfile not found"; exit 1
          fi
          echo "Detected PROJ_DIR=$PROJ_DIR"

      - name: Clean caches
        run: |
          rm -rf "$PROJ_DIR/node_modules"
          rm -rf "$PROJ_DIR/ios/Pods" "$PROJ_DIR/ios/Podfile.lock" "$PROJ_DIR/ios/build"
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Install JS deps (npm ci, no dev deps)
        run: |
          cd "$PROJ_DIR"
          if [ -f package-lock.json ]; then
            npm ci --omit=dev --legacy-peer-deps
          else
            echo "::warning::package-lock.json not found; running npm install"
            npm install --omit=dev --legacy-peer-deps
          fi

      - name: Install RN autolinking CLI (as prod deps)
        run: |
          cd "$PROJ_DIR"
          npm i --save --legacy-peer-deps \
            @react-native-community/cli \
            @react-native-community/cli-platform-ios \
            expo-modules-autolinking
          node -e "console.log('RN CLI:', require('@react-native-community/cli/package.json').version); console.log('CLI iOS:', require('@react-native-community/cli-platform-ios/package.json').version)"

      - name: Ensure iOS native project (conditional Expo prebuild)
        run: |
          cd "$PROJ_DIR"
          if [ -z "$(ls -1 ios/*.xcodeproj 2>/dev/null)" ]; then
            echo "🛠  No .xcodeproj found — running Expo prebuild (iOS only)..."
            npx expo prebuild --platform ios --no-install --clean
            # ✅ 커밋된 Podfile로 복원 (prebuild가 덮어썼을 수 있음)
            git checkout -- ios/Podfile || true
            echo "== ios contents after prebuild =="
            ls -la ios
          else
            echo "✅ .xcodeproj found; skipping prebuild."
          fi

      - name: Debug iOS folder
        run: |
          cd "$PROJ_DIR/ios"
          echo "== ios contents =="
          ls -la
          echo "== Xcode projects =="
          ls -1 *.xcodeproj || true

      # Pods 캐시를 pod install 이전에 두어 복원 효과를 누림
      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJ_DIR }}/ios/Pods
            ${{ env.PROJ_DIR }}/ios/Podfile.lock
          key: ${{ runner.os }}-pods-${{ hashFiles(format('{0}/ios/Podfile.lock', env.PROJ_DIR)) }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd "$PROJ_DIR/ios"
          pod install --repo-update

      # Diagnose build settings for unexpected -G flags
      - name: Diagnose build settings for '-G'
        run: |
          cd "$PROJ_DIR/ios"
          if [ -f "PickPlay.xcworkspace/contents.xcworkspacedata" ]; then
            echo "🔎 Checking build settings for '-G'..."
            xcodebuild -showBuildSettings -workspace PickPlay.xcworkspace -scheme PickPlay -configuration Release | grep -n " -G " || true
          fi

      # Scrub '-G' directly from project.pbxproj (app and pods)
      - name: Scrub '-G' from pbxproj (app and pods)
        run: |
          cd "$PROJ_DIR/ios"
          for f in "PickPlay.xcodeproj/project.pbxproj" "Pods/Pods.xcodeproj/project.pbxproj"; do
            if [ -f "$f" ]; then
              # 공백 앞뿐 아니라 문자열 시작(^) 위치도 커버
              perl -i -pe 's/(^|\s)-G(?=\s|\"|$)/ /g' "$f"
            fi
          done

      # 1️⃣ 체크포인트: -G 잔여 여부 스캔 (빌드 설정 파일만, 문서 제외)
      - name: Checkpoint 1 - Scan for stray '-G' flags
        run: |
          cd "$PROJ_DIR/ios"
          echo "🔎 [Checkpoint 1] Scanning for stray '-G' flags in build config files only..."
          set +e
          # 빌드 설정 파일만 스캔 (문서/README 제외)
          result=$(find . -type f \( \
            -name "*.xcconfig" \
            -o -name "*.pbxproj" \
            -o -name "*.xcscheme" \
            -o -name "*.plist" \
            -o -name "*.m" \
            -o -name "*.mm" \
            -o -name "*.cpp" \
            -o -name "*.c" \
            -o -name "*.h" \
          \) ! -path "*/Pods/Target Support Files/Pods-*/Pods-*.xcconfig" \
            -exec grep -l --line-number -E '\s-G(\s|$)' {} \; 2>/dev/null || true)
          set -e
          if [ -n "$result" ]; then
            echo "::error::Found stray '-G' flags in build config files:"
            echo "$result"
            exit 1
          else
            echo "✅ [Checkpoint 1] No '-G' flags found in build config files (0 instances confirmed)"
          fi

      # ✅ -G 플래그 강제 제거(안전장치) - BoringSSL-GRPC 타겟 포함 모든 곳 스크럽
      - name: Scrub invalid '-G' flags from xcconfigs and pbxproj (safety)
        run: |
          cd "$PROJ_DIR/ios"
          
          # 1. 모든 .xcconfig 파일에서 -G 제거
          find "Pods/Target Support Files" -name "*.xcconfig" -type f 2>/dev/null | while read file; do
            if grep -qE '\s-G(\s|$)' "$file" 2>/dev/null; then
              perl -i -pe 's/\s-G(\s|$)/ /g' "$file"
              perl -i -pe 's/-G\s/ /g' "$file"
              perl -i -pe 's/^-G\b//g' "$file"
              echo "🧽 Scrubbed -G from: $file"
            fi
          done
          
          # 2. Pods.xcodeproj의 project.pbxproj에서도 -G 제거 (BoringSSL-GRPC 등 모든 타겟)
          if [ -f "Pods/Pods.xcodeproj/project.pbxproj" ]; then
            if grep -qE '\s-G(\s|$)' "Pods/Pods.xcodeproj/project.pbxproj" 2>/dev/null; then
              perl -i -pe 's/\s-G(\s|$)/ /g' "Pods/Pods.xcodeproj/project.pbxproj"
              perl -i -pe 's/-G\s/ /g' "Pods/Pods.xcodeproj/project.pbxproj"
              perl -i -pe 's/^-G\b//g' "Pods/Pods.xcodeproj/project.pbxproj"
              echo "🧽 Scrubbed -G from Pods.xcodeproj/project.pbxproj"
            fi
          fi
          
          # 3. 검증: 남아있는 -G 플래그 확인 (BoringSSL-GRPC 포함)
          remaining=$(grep -rE '\s-G(\s|$)' "Pods/Target Support Files" "Pods/Pods.xcodeproj" 2>/dev/null | grep -v "README\|\.md\|cmake" | wc -l || echo 0)
          if [ "$remaining" -gt 0 ]; then
            echo "::warning::Still found $remaining instances of '-G' flag"
            grep -rnE '\s-G(\s|$)' "Pods/Target Support Files" "Pods/Pods.xcodeproj" 2>/dev/null | grep -v "README\|\.md\|cmake" | head -10
          else
            echo "👍 No -G flags found in build config files."
          fi

      # 🎯 BoringSSL-GRPC 전용 정밀 진단/스크럽
      - name: Targeted scrub and diagnose for BoringSSL-GRPC
        run: |
          cd "$PROJ_DIR/ios"
          set +e
          echo "🔎 Checking BoringSSL-GRPC Target Support Files for -G..."
          if [ -d "Pods/Target Support Files/BoringSSL-GRPC" ]; then
            grep -Rne '\\s-G(\\s|$)' "Pods/Target Support Files/BoringSSL-GRPC" 2>/dev/null || true
            # -exec 대신 쉘 루프로 세미콜론 이슈 회피
            while IFS= read -r f; do
              perl -i -pe 's/\\s-G(?=\\s|$)/ /g' "$f" 2>/dev/null || true
            done < <(find "Pods/Target Support Files/BoringSSL-GRPC" -type f -name "*.xcconfig" 2>/dev/null)
          fi
          echo "🔎 Checking xcodebuild settings for BoringSSL-GRPC..."
          xcodebuild -showBuildSettings -project Pods/Pods.xcodeproj -target BoringSSL-GRPC -configuration Release 2>/dev/null | grep -n ' -G ' || true
          set -e
          # 최종 안전장치: Pods 프로젝트 전체에서 -G 재제거
          if [ -f "Pods/Pods.xcodeproj/project.pbxproj" ]; then
            perl -i -pe 's/\\s-G(?=\\s|$)/ /g' "Pods/Pods.xcodeproj/project.pbxproj"
          fi

      # 🔎 BoringSSL-GRPC 빌드 설정 덤프 (-G가 걸린 키 식별)
      - name: Dump BoringSSL-GRPC build settings (grep FLAGS)
        run: |
          cd "$PROJ_DIR/ios"
          xcodebuild -showBuildSettings -project Pods/Pods.xcodeproj -target BoringSSL-GRPC -configuration Release | egrep -n '(^| )OTHER_.*FLAGS|CLANG_.*FLAGS|GCC_.*FLAGS' | sed -n '1,200p'

      # 🔧 Pods.xcodeproj를 직접 수정하여 BoringSSL-GRPC 플래그 초기화 (xcodeproj 사용)
      - name: Force reset flags for BoringSSL-GRPC via xcodeproj
        run: |
          cd "$PROJ_DIR/ios"
          ruby -r xcodeproj -e '
            proj_path = "Pods/Pods.xcodeproj"
            abort("no Pods.xcodeproj") unless File.exist?(proj_path)
            p = Xcodeproj::Project.open(proj_path)
            tgt = p.targets.find { |t| t.name == "BoringSSL-GRPC" }
            abort("no BoringSSL-GRPC target") unless tgt
            keys = %w[OTHER_CFLAGS OTHER_CPLUSPLUSFLAGS OTHER_LDFLAGS WARNING_CFLAGS GCC_PREPROCESSOR_DEFINITIONS]
            scrub = proc do |val|
              case val
              when Array
                val.map { |s| s.to_s.gsub(/(^|\s)-G(?=\s|$)/, " ").squeeze(" ").strip }.reject(&:empty?)
              when String
                v = val.gsub(/(^|\s)-G(?=\s|$)/, " ").squeeze(" ").strip
                v.empty? ? "$(inherited)" : v
              else
                "$(inherited)"
              end
            end
            tgt.build_configurations.each do |cfg|
              keys.each do |k|
                v = cfg.build_settings[k]
                v = scrub.call(v)
                v = ["$(inherited)"] if v.is_a?(Array) && v.empty?
                cfg.build_settings[k] = v.nil? || (v.respond_to?(:empty?) && v.empty?) ? "$(inherited)" : v
              end
            end
            p.save
            puts "✅ BoringSSL-GRPC flags reset to $(inherited)"
          '

      # 🔧 Pods 전역: 모든 빌드 파일의 COMPILER_FLAGS에서 -G 제거 (BoringSSL-GRPC 포함)
      - name: Purge -G from build file COMPILER_FLAGS in Pods
        run: |
          cd "$PROJ_DIR/ios"
          ruby -r xcodeproj -e '
            proj_path = "Pods/Pods.xcodeproj"
            abort("no Pods.xcodeproj") unless File.exist?(proj_path)
            p = Xcodeproj::Project.open(proj_path)
            changed = 0
            p.targets.each do |t|
              t.build_phases.grep(Xcodeproj::Project::Object::PBXSourcesBuildPhase).each do |phase|
                phase.files.each do |bf|
                  settings = bf.settings ||= {}
                  flags = settings["COMPILER_FLAGS"]
                  next unless flags.is_a?(String) || flags.is_a?(Array)
                  new_flags = if flags.is_a?(Array)
                    flags.map { |s| s.to_s.gsub(/(^|\s)-G(?=\s|$)/, " ").squeeze(" ").strip }.reject(&:empty?)
                  else
                    v = flags.to_s.gsub(/(^|\s)-G(?=\s|$)/, " ").squeeze(" ").strip
                    v
                  end
                  unless new_flags == flags
                    settings["COMPILER_FLAGS"] = new_flags
                    changed += 1
                  end
                end
              end
            end
            p.save if changed > 0
            puts "✅ Purged -G from #{changed} build file COMPILER_FLAGS entries"
          '

      # 🔧 Pods 전역: 모든 타겟의 FLAGS 계열 키에서 -G 토큰 제거 (광범위)
      - name: Purge -G from all FLAGS keys across Pods targets
        run: |
          cd "$PROJ_DIR/ios"
          ruby -r xcodeproj -e '
            proj_path = "Pods/Pods.xcodeproj"
            abort("no Pods.xcodeproj") unless File.exist?(proj_path)
            p = Xcodeproj::Project.open(proj_path)
            keys = %w[OTHER_CFLAGS OTHER_CPLUSPLUSFLAGS OTHER_LDFLAGS WARNING_CFLAGS
                      GCC_PREPROCESSOR_DEFINITIONS CLANG_CXX_LIBRARY CLANG_CXX_LANGUAGE_STANDARD
                      CLANG_CXX_LIBRARY CLANG_CXX_LANGUAGE_STANDARD CLANG_WARN_DOCUMENTATION_COMMENTS]
            # 위 키 외에도 *_FLAGS 로 끝나는 모든 키 포함
            def scrub_val(v)
              case v
              when Array
                v.map { |s| s.to_s.gsub(/(^|\s)-G(?=\s|$)/, " ").squeeze(" ").strip }.reject(&:empty?)
              when String
                nv = v.gsub(/(^|\s)-G(?=\s|$)/, " ").squeeze(" ").strip
                nv.empty? ? "$(inherited)" : nv
              else
                v
              end
            end
            changed = 0
            p.targets.each do |t|
              t.build_configurations.each do |cfg|
                # 1) 미리 정의한 키들
                keys.each do |k|
                  next unless cfg.build_settings.key?(k)
                  old = cfg.build_settings[k]
                  nv = scrub_val(old)
                  next if nv == old
                  cfg.build_settings[k] = nv
                  changed += 1
                end
                # 2) *_FLAGS 패턴 키 전수
                cfg.build_settings.keys.grep(/FLAGS$/).each do |k|
                  old = cfg.build_settings[k]
                  nv = scrub_val(old)
                  next if nv == old
                  cfg.build_settings[k] = nv
                  changed += 1
                end
              end
            end
            p.save if changed > 0
            puts "✅ Purged -G tokens from FLAGS keys: #{changed} updates"
          '

      # Verify/patch aps-environment for Release
      - name: Verify/patch aps-environment for Release
        run: |
          set -e
          cd "$PROJ_DIR/ios"
          ENT_FILE="$(/usr/bin/find . -name '*.entitlements' -maxdepth 2 | head -n1 || true)"
          if [ -z "$ENT_FILE" ]; then
            echo "::warning::No entitlements file found; skipping check."
            exit 0
          fi
          echo "Found entitlements: $ENT_FILE"
          CURRENT=$(/usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENT_FILE" 2>/dev/null || echo "")
          echo "aps-environment in entitlements: ${CURRENT:-<none>}"
          if [ "$CURRENT" = "development" ]; then
            echo "Patching aps-environment to production"
            /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT_FILE"
            /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENT_FILE"
          fi

      # 4️⃣ 체크포인트: 스킴 공유 확인 (PickPlay 하나로 공유 확인)
      - name: Checkpoint 4 - Verify Xcode workspace & schemes
        run: |
          cd "$PROJ_DIR/ios"
          if [ -f "PickPlay.xcworkspace/contents.xcworkspacedata" ]; then
            echo "🔍 [Checkpoint 4] Verifying workspace and schemes..."
            xcodebuild -list -workspace PickPlay.xcworkspace | tee /tmp/xcode-list.txt
            if grep -q "Scheme:" /tmp/xcode-list.txt; then
              schemes=$(grep -A 100 "Schemes:" /tmp/xcode-list.txt | grep -v "Schemes:" | sed '/^$/,$d' | grep -v "^$" | sed 's/^[[:space:]]*//' || true)
              echo "✅ [Checkpoint 4] Found schemes:"
              echo "$schemes" | while read scheme; do
                if [ -n "$scheme" ]; then
                  echo "   - $scheme"
                fi
              done
              if echo "$schemes" | grep -q "PickPlay"; then
                echo "✅ [Checkpoint 4] PickPlay scheme found (shared scheme confirmed)"
              else
                echo "::warning::[Checkpoint 4] PickPlay scheme not found in list"
              fi
            fi
          else
            WS=$(ls -1 *.xcworkspace 2>/dev/null | head -n1 || true)
            if [ -n "$WS" ]; then
              echo "Detected workspace: $WS"
              xcodebuild -list -workspace "$WS"
            else
              echo "::warning::[Checkpoint 4] No .xcworkspace found yet."
            fi
          fi

      - name: Fastlane beta
        env:
          # App Store Connect
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
          # Apple/Match
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_PASSWORD: ${{ secrets.MATCH_GIT_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BRANCH: master  # certs repo 기본 브랜치 (에러 로그에서 master 확인)
          KEYCHAIN_PASSWORD: actions
          # (옵션) Firebase App Distribution — 없으면 빈 값으로 넘어가도 무방
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          cd "$PROJ_DIR"
          if [ -f Gemfile ]; then
            bundle exec fastlane ios beta
          else
            fastlane ios beta
          fi
