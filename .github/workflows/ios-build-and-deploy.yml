name: iOS Build (Dev Client → TestFlight)

on:
  push:
    branches: [main, release]
  workflow_dispatch:

jobs:
  # 1단계: Dev Client 빌드 (선행)
  ios-dev-client:
    runs-on: macos-14
    timeout-minutes: 120
    outputs:
      build-success: ${{ job.status == 'success' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Setup Node.js (cache lockfile anywhere)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Write App Store Connect API key to file
        env:
          ASC_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [ -z "$ASC_P8_BASE64" ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 secret가 비어 있습니다." && exit 1
          fi

          export KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"

          python3 <<'PY'
          import os, base64
          key_base64 = os.environ['ASC_P8_BASE64']
          key = base64.b64decode(key_base64).decode('utf-8')
          path = os.environ['KEY_PATH']
          with open(path, 'w', encoding='utf-8') as f:
              f.write(key)
          PY

          if [ ! -s "$KEY_PATH" ]; then
            echo "::error::AuthKey 파일 생성 실패 (파일이 비어 있거나 존재하지 않음)" && exit 1
          fi

          chmod 600 "$KEY_PATH"
          ls -l "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV

      - name: Setup Ruby & tools
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Fastlane/CocoaPods/xcodeproj
        run: |
          gem install fastlane --no-document
          gem install cocoapods --no-document
          gem install xcodeproj --no-document

      - name: Detect project dir
        run: |
          if [ -f ./pickplay/ios/Podfile ]; then
            echo "PROJ_DIR=pickplay" >> $GITHUB_ENV
          elif [ -f ./ios/Podfile ]; then
            echo "PROJ_DIR=." >> $GITHUB_ENV
          else
            echo "::error::ios/Podfile not found"; exit 1
          fi
          echo "Detected PROJ_DIR=$PROJ_DIR"

      - name: Clean build artifacts only
        run: |
          # node_modules와 Pods는 캐시를 활용하므로 삭제하지 않음
          # 빌드 아티팩트만 정리
          rm -rf "$PROJ_DIR/ios/build"
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          echo "✅ Build artifacts cleaned (keeping node_modules and Pods for cache)"

      - name: Install JS deps (npm ci, no dev deps)
        run: |
          cd "$PROJ_DIR"
          if [ -f package-lock.json ]; then
            npm ci --omit=dev --legacy-peer-deps
          else
            echo "::warning::package-lock.json not found; running npm install"
            npm install --omit=dev --legacy-peer-deps
          fi
          # react-native-worklets는 React Native 0.76.9와 호환되지 않으므로 제거
          if [ -d "node_modules/react-native-worklets" ]; then
            echo "⚠️  react-native-worklets 제거 중 (호환성 문제)"
            rm -rf node_modules/react-native-worklets
            npm uninstall react-native-worklets --legacy-peer-deps || true
          fi

      - name: Align RN/Expo package versions (expo install --fix)
        run: |
          cd "$PROJ_DIR"
          echo "📦 Running expo install --fix..."
          BEFORE=$(cat package.json 2>/dev/null | grep -E '"(react-native|expo)"' | head -2 || echo "")
          npx expo install --fix --no-interactive || true
          AFTER=$(cat package.json 2>/dev/null | grep -E '"(react-native|expo)"' | head -2 || echo "")
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::warning::expo install --fix changed package versions:"
            echo "Before: $BEFORE"
            echo "After: $AFTER"
          else
            echo "✅ No version changes detected"
          fi

      - name: Install RN autolinking CLI (prod)
        run: |
          cd "$PROJ_DIR"
          npm i --save --legacy-peer-deps \
            @react-native-community/cli \
            @react-native-community/cli-platform-ios \
            expo-modules-autolinking

      - name: Verify app.json exists (react-native-google-mobile-ads)
        run: |
          cd "$PROJ_DIR"
          echo "🔍 app.json 확인 중 (react-native-google-mobile-ads용)..."
          if [ ! -f app.json ]; then
            echo "::error::app.json이 없습니다! Git에 커밋되어 있어야 합니다."
            exit 1
          fi
          # react-native-google-mobile-ads 설정 확인
          if ! node -e "const fs=require('fs'); const json=JSON.parse(fs.readFileSync('app.json','utf8')); if(!json['react-native-google-mobile-ads']||!json['react-native-google-mobile-ads'].ios_app_id){console.log('❌ app.json에 react-native-google-mobile-ads.ios_app_id가 없습니다!'); process.exit(1);} console.log('✅ app.json 확인 완료:', JSON.stringify(json['react-native-google-mobile-ads']));"; then
            echo "::error::app.json에 react-native-google-mobile-ads 설정이 올바르지 않습니다!"
            exit 1
          fi

      - name: Sync iOS native config (Expo prebuild)
        env:
          EXPO_NO_INTERACTIVE: "1"
        run: |
          cd "$PROJ_DIR"
          echo "🛠  Expo prebuild (ios)로 Info.plist 및 native 설정을 동기화합니다..."
          # --clean 플래그 제거: 기존 프로젝트 재사용 (더 빠름)
          npx expo prebuild --platform ios --no-install --non-interactive
          # expo prebuild가 생성한 Podfile을 사용하되, 필요한 커스텀 설정만 추가
          # (Google-Mobile-Ads-SDK 및 커스텀 post_install 스크립트)
          if [ -f ios/Podfile ]; then
            echo "📝 expo prebuild가 생성한 Podfile에 커스텀 설정 추가..."
            # Google-Mobile-Ads-SDK가 없으면 추가
            if ! grep -q "Google-Mobile-Ads-SDK" ios/Podfile; then
              # target 'pickplay' do 블록의 첫 번째 end 앞에 pod 추가
              python3 -c "import re; content = open('ios/Podfile').read(); pattern = r\"(target ['\\\"].*pickplay.*['\\\"] do\\s+.*?)(\\nend)\"; replacement = r\"\\1\\n  # Ensure AdMob headers are available for AppDelegate logging during dev client builds\\n  pod 'Google-Mobile-Ads-SDK'\\2\"; content = re.sub(pattern, replacement, content, flags=re.DOTALL); open('ios/Podfile', 'w').write(content)"
            fi
            # 커스텀 post_install 블록이 없으면 추가
            if ! grep -q "# Custom Folly and C++20 settings" ios/Podfile; then
              cat scripts/add-folly-settings.rb >> ios/Podfile
            fi
            echo "✅ Podfile 커스텀 설정 추가 완료"
          fi
          echo "✅ Expo prebuild 완료"
          
          # expo prebuild 후에도 app.json이 올바르게 유지되는지 확인 및 재생성
          echo "🔍 expo prebuild 후 app.json 확인 중..."
          if [ ! -f app.json ]; then
            echo "⚠️  expo prebuild 후 app.json이 없습니다! 재생성합니다..."
            node -e "
              const config = require('./app.config.js');
              const fs = require('fs');
              let appJson = { ...config.expo };
              if (config.expo.extra && config.expo.extra['react-native-google-mobile-ads']) {
                appJson['react-native-google-mobile-ads'] = config.expo.extra['react-native-google-mobile-ads'];
              }
              fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2));
              console.log('✅ app.json 재생성 완료');
            "
          else
            # app.json이 있지만 react-native-google-mobile-ads 설정이 없으면 재생성
            if ! node -e "const fs=require('fs'); const json=JSON.parse(fs.readFileSync('app.json','utf8')); if(!json['react-native-google-mobile-ads']||!json['react-native-google-mobile-ads'].ios_app_id){console.log('❌ app.json에 react-native-google-mobile-ads 설정이 없습니다!'); process.exit(1);} console.log('✅ app.json 확인 완료');"; then
              echo "⚠️  app.json에 react-native-google-mobile-ads 설정이 없습니다! 재생성합니다..."
              node -e "
                const config = require('./app.config.js');
                const fs = require('fs');
                let appJson = { ...config.expo };
                if (config.expo.extra && config.expo.extra['react-native-google-mobile-ads']) {
                  appJson['react-native-google-mobile-ads'] = config.expo.extra['react-native-google-mobile-ads'];
                }
                fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2));
                console.log('✅ app.json 재생성 완료');
              "
            fi
          fi
          # 여러 위치에 복사
          cp app.json ios/app.json 2>/dev/null || true
          cp app.json ios/pickplay/app.json 2>/dev/null || true
          echo "✅ app.json 확인 및 복사 완료"

      - name: Ensure AdMob app id injected into Info.plist
        run: |
          cd "$PROJ_DIR"
          INFO_PLIST="ios/pickplay/Info.plist"
          if [ ! -f "$INFO_PLIST" ]; then
            echo "::error::Info.plist not found at $INFO_PLIST"
            exit 1
          fi
          GAD_APP_ID=$(node -e "const config=require('./app.config.js'); const val=config?.expo?.ios?.infoPlist?.GADApplicationIdentifier; if(!val){process.exit(1);} process.stdout.write(val);" 2>/dev/null || true)
          if [ -z "$GAD_APP_ID" ]; then
            echo "::error::app.config.js에서 GADApplicationIdentifier 값을 찾을 수 없습니다."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $GAD_APP_ID" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $GAD_APP_ID" "$INFO_PLIST"
          CHECK_ID=$(/usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$INFO_PLIST" 2>/dev/null || true)
          if [ "$CHECK_ID" != "$GAD_APP_ID" ]; then
            echo "::error::Info.plist에 GADApplicationIdentifier 설정에 실패했습니다."
            exit 1
          fi
          echo "✅ Info.plist에 GADApplicationIdentifier 설정 완료: $CHECK_ID"

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJ_DIR }}/ios/Pods
            ${{ env.PROJ_DIR }}/ios/Podfile.lock
          key: pods-clear-${{ hashFiles(format('{0}/ios/Podfile.lock', env.PROJ_DIR)) }}

      - name: Clean CocoaPods Cache (skip if cached)
        run: |
          # 캐시가 있으면 CocoaPods 캐시 정리 건너뛰기 (빠른 빌드)
          if [ ! -d "$PROJ_DIR/ios/Pods" ] || [ ! -f "$PROJ_DIR/ios/Podfile.lock" ]; then
            echo "📦 Pods 캐시 없음, CocoaPods 캐시 정리"
            pod cache clean --all || true
          else
            echo "✅ Pods 캐시 있음, CocoaPods 캐시 정리 건너뛰기"
          fi

      - name: Verify app.json before pod install
        run: |
          cd "$PROJ_DIR"
          echo "🔍 pod install 전 app.json 확인 중..."
          if [ ! -f app.json ]; then
            echo "::error::app.json이 없습니다! Git에 커밋되어 있어야 합니다."
            exit 1
          fi
          # react-native-google-mobile-ads 설정 확인
          if ! node -e "const fs=require('fs'); const json=JSON.parse(fs.readFileSync('app.json','utf8')); if(!json['react-native-google-mobile-ads']||!json['react-native-google-mobile-ads'].ios_app_id){console.log('❌ app.json에 react-native-google-mobile-ads.ios_app_id가 없습니다!'); process.exit(1);} console.log('✅ app.json 확인 완료');"; then
            echo "::error::app.json에 react-native-google-mobile-ads 설정이 올바르지 않습니다!"
            exit 1
          fi
          echo "✅ app.json 확인 완료"

      - name: Install CocoaPods
        run: |
          cd "$PROJ_DIR"
          # pod install 전에 app.json을 여러 위치에 복사 (CocoaPods 스크립트가 찾을 수 있도록)
          if [ -f app.json ]; then
            echo "📋 pod install 전 app.json 복사 중..."
            cp app.json ios/app.json 2>/dev/null || true
            cp app.json ios/pickplay/app.json 2>/dev/null || true
            echo "✅ app.json 복사 완료"
          fi
          cd "$PROJ_DIR/ios"
          # 캐시가 있으면 repo-update 생략 (빠른 설치)
          if [ -d "Pods" ] && [ -f "Podfile.lock" ]; then
            echo "📦 Pods 캐시 발견, 빠른 설치 모드"
            pod install
          else
            echo "📦 Pods 캐시 없음, 전체 설치 (repo-update 포함)"
            pod install --repo-update
          fi
          # pod install 후에도 app.json 확인
          cd "$PROJ_DIR"
          if [ ! -f app.json ]; then
            echo "::error::pod install 후 app.json이 없습니다!"
            exit 1
          fi
          # pod install 후에도 여러 위치에 복사
          cp app.json ios/app.json 2>/dev/null || true
          cp app.json ios/pickplay/app.json 2>/dev/null || true
          echo "✅ pod install 완료, app.json 확인 및 복사 완료"
          # pod install 후 CocoaPods 스크립트 확인
          echo "===== pod install 후 CocoaPods 스크립트 확인 ====="
          # RNGoogleMobileAds 관련 모든 파일 찾기
          echo "--- RNGoogleMobileAds 관련 파일 찾기 ---"
          find ios/Pods -type f -name "*RNGoogleMobileAds*" 2>/dev/null | head -20
          # Target Support Files 디렉토리 확인
          if [ -d "ios/Pods/Target Support Files/RNGoogleMobileAds" ]; then
            echo "✅ RNGoogleMobileAds 타겟 지원 파일 디렉토리 발견"
            echo "--- 디렉토리 내용 ---"
            ls -la "ios/Pods/Target Support Files/RNGoogleMobileAds/" 2>/dev/null || true
            # 스크립트 파일 찾기
            find "ios/Pods/Target Support Files/RNGoogleMobileAds" -type f 2>/dev/null | while read script; do
              echo "--- 파일: $script ---"
              if grep -q "app.json" "$script" 2>/dev/null; then
                echo "✅ 이 파일에서 app.json을 참조합니다:"
                grep -n "app.json" "$script" 2>/dev/null | head -10
                echo "--- 파일 내용 (app.json 관련 부분) ---"
                cat "$script" 2>/dev/null | grep -A 10 -B 10 "app.json" | head -30
              fi
            done
          else
            echo "⚠️  RNGoogleMobileAds 타겟 지원 파일 디렉토리를 찾을 수 없습니다"
            echo "--- Target Support Files 디렉토리 목록 ---"
            ls -la "ios/Pods/Target Support Files/" 2>/dev/null | grep -i "google\|mobile\|ads" || echo "관련 디렉토리 없음"
          fi
          # node_modules에서 원본 스크립트 확인
          echo "===== node_modules에서 react-native-google-mobile-ads 스크립트 확인 ====="
          if [ -d "node_modules/react-native-google-mobile-ads" ]; then
            echo "✅ node_modules/react-native-google-mobile-ads 디렉토리 발견"
            find node_modules/react-native-google-mobile-ads -type f \( -name "*.rb" -o -name "*.sh" -o -name "*.podspec" \) 2>/dev/null | head -10
            # podspec 파일 전체 내용 확인
            if [ -f "node_modules/react-native-google-mobile-ads/RNGoogleMobileAds.podspec" ]; then
              echo "--- RNGoogleMobileAds.podspec 전체 내용 ---"
              cat "node_modules/react-native-google-mobile-ads/RNGoogleMobileAds.podspec" 2>/dev/null
            fi
          fi

      - name: Print Podfile.lock (debug)
        run: |
          cd "$PROJ_DIR/ios"
          if [ -f Podfile.lock ]; then
            echo "===== Podfile.lock (head) ====="
            head -n 200 Podfile.lock
            echo "===== End Podfile.lock (head) ====="
          else
            echo "::warning::Podfile.lock not found after pod install"
          fi

      - name: Print Podfile (debug)
        run: |
          cd "$PROJ_DIR/ios"
          if [ -f Podfile ]; then
            echo "===== Podfile ====="
            cat Podfile
            echo "===== End Podfile ====="
          else
            echo "::warning::Podfile not found after prebuild"
          fi

      - name: Verify required pods
        shell: bash
        run: |
          cd "$PROJ_DIR/ios"
          required_pods=("RNGoogleMobileAds" "RNFBApp" "RNCAsyncStorage" "RNReanimated")
          missing=0
          for pod in "${required_pods[@]}"; do
            if grep -q "$pod" Podfile.lock; then
              echo "✅ Found $pod in Podfile.lock"
            else
              echo "::error::$pod not found in Podfile.lock"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Debug CocoaPods script working directory and app.json path
        run: |
          cd "$PROJ_DIR"
          echo "🔍 CocoaPods 스크립트가 실행되는 작업 디렉토리 및 app.json 경로 확인 중..."
          echo "===== 프로젝트 구조 확인 ====="
          echo "현재 작업 디렉토리: $(pwd)"
          echo "프로젝트 루트: $PROJ_DIR"
          echo "===== app.json 위치 확인 ====="
          ls -la app.json 2>/dev/null && echo "✅ 프로젝트 루트에 app.json 존재" || echo "❌ 프로젝트 루트에 app.json 없음"
          ls -la ios/app.json 2>/dev/null && echo "✅ ios/app.json 존재" || echo "❌ ios/app.json 없음"
          ls -la ios/pickplay/app.json 2>/dev/null && echo "✅ ios/pickplay/app.json 존재" || echo "❌ ios/pickplay/app.json 없음"
          echo "===== node_modules에서 react-native-google-mobile-ads 원본 스크립트 확인 ====="
          if [ -d "node_modules/react-native-google-mobile-ads" ]; then
            echo "✅ node_modules/react-native-google-mobile-ads 디렉토리 발견"
            # podspec 파일 확인
            if [ -f "node_modules/react-native-google-mobile-ads/RNGoogleMobileAds.podspec" ]; then
              echo "--- RNGoogleMobileAds.podspec 전체 내용 ---"
              cat "node_modules/react-native-google-mobile-ads/RNGoogleMobileAds.podspec" 2>/dev/null | head -100
            fi
            # iOS 스크립트 파일 찾기
            echo "--- iOS 관련 스크립트 파일 찾기 ---"
            find node_modules/react-native-google-mobile-ads/ios -type f \( -name "*.sh" -o -name "*.rb" -o -name "*.js" \) 2>/dev/null | head -10
          else
            echo "⚠️  node_modules/react-native-google-mobile-ads 디렉토리가 없습니다"
          fi
          echo "===== Xcode 빌드 시 환경 변수 정보 ====="
          echo "일반적으로 CocoaPods 스크립트는 다음 환경 변수를 사용합니다:"
          echo "- SRCROOT: 프로젝트 루트 디렉토리 (일반적으로 ios/의 부모 디렉토리)"
          echo "- PROJECT_DIR: 프로젝트 디렉토리"
          echo "- PWD: 현재 작업 디렉토리 (빌드 시점에 다를 수 있음)"

      - name: Verify app.json before build
        run: |
          cd "$PROJ_DIR"
          echo "🔍 빌드 전 app.json 최종 확인 중..."
          if [ ! -f app.json ]; then
            echo "::error::app.json이 없습니다! Git에 커밋되어 있어야 합니다."
            exit 1
          fi
          # react-native-google-mobile-ads 설정 확인
          if ! node -e "const fs=require('fs'); const json=JSON.parse(fs.readFileSync('app.json','utf8')); if(!json['react-native-google-mobile-ads']||!json['react-native-google-mobile-ads'].ios_app_id){console.log('❌ app.json에 react-native-google-mobile-ads.ios_app_id가 없습니다!'); process.exit(1);} console.log('✅ app.json 확인 완료');"; then
            echo "::error::app.json에 react-native-google-mobile-ads 설정이 올바르지 않습니다!"
            exit 1
          fi
          # CocoaPods 스크립트가 찾을 수 있도록 여러 위치에 복사
          echo "📋 app.json을 여러 위치에 복사 중..."
          cp app.json ios/app.json 2>/dev/null || true
          cp app.json ios/pickplay/app.json 2>/dev/null || true
          # 프로젝트 루트의 app.json 내용 확인 (디버깅)
          echo "===== app.json의 react-native-google-mobile-ads 설정 ====="
          node -e "const fs=require('fs'); const json=JSON.parse(fs.readFileSync('app.json','utf8')); console.log(JSON.stringify(json['react-native-google-mobile-ads'], null, 2));"
          echo "✅ app.json 확인 및 복사 완료"

      - name: Fastlane dev_client
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_PASSWORD: ${{ secrets.MATCH_GIT_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BRANCH: master
          KEYCHAIN_PASSWORD: actions
        run: |
          cd "$PROJ_DIR"
          # 빌드 직전에 app.json 확인 및 복사 (CocoaPods 스크립트가 찾을 수 있도록)
          if [ ! -f app.json ]; then
            echo "::error::빌드 직전에 app.json이 없습니다!"
            exit 1
          fi
          # 여러 위치에 복사
          cp app.json ios/app.json 2>/dev/null || true
          cp app.json ios/pickplay/app.json 2>/dev/null || true
          # SRCROOT 환경 변수 확인 (Xcode 빌드 시 사용됨)
          echo "===== 빌드 직전 환경 변수 확인 ====="
          echo "현재 작업 디렉토리: $(pwd)"
          echo "SRCROOT는 Xcode 빌드 시 자동으로 설정됩니다 (프로젝트 루트)"
          echo "✅ 빌드 직전 app.json 복사 완료"
          if [ -f Gemfile ]; then
            bundle exec fastlane ios dev_client 2>&1 | tee /tmp/fastlane_build.log || {
              echo "::error::빌드 실패, 로그 확인 중..."
              # app.json 관련 에러 찾기
              grep -i "app.json\|ios_app_id\|react-native-google-mobile-ads" /tmp/fastlane_build.log | head -20 || true
              exit 1
            }
          else
            fastlane ios dev_client 2>&1 | tee /tmp/fastlane_build.log || {
              echo "::error::빌드 실패, 로그 확인 중..."
              # app.json 관련 에러 찾기
              grep -i "app.json\|ios_app_id\|react-native-google-mobile-ads" /tmp/fastlane_build.log | head -20 || true
              exit 1
            }
          fi
          
          # Fastlane 빌드 로그에서 IPA 파일 경로 추출
          echo "===== Fastlane 빌드 로그에서 IPA 파일 경로 확인 ====="
          grep -i "\.ipa\|IPA\|export.*ipa\|generated.*ipa" /tmp/fastlane_build.log | tail -20 || echo "IPA 관련 로그 없음"

      - name: Find and upload IPA file
        run: |
          cd "$PROJ_DIR"
          echo "🔍 IPA 파일 찾기 중..."
          echo "현재 작업 디렉토리: $(pwd)"
          
          # 1. 프로젝트 루트에서 검색
          echo "===== 1. 프로젝트 루트 검색 ====="
          IPA_FILE=$(find . -maxdepth 1 -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -n "$IPA_FILE" ]; then
            echo "✅ 프로젝트 루트에서 발견: $IPA_FILE"
          fi
          
          # 2. fastlane 디렉토리에서 검색
          if [ -z "$IPA_FILE" ]; then
            echo "===== 2. fastlane 디렉토리 검색 ====="
            IPA_FILE=$(find ./fastlane -name "*.ipa" -type f 2>/dev/null | head -1)
            if [ -n "$IPA_FILE" ]; then
              echo "✅ fastlane 디렉토리에서 발견: $IPA_FILE"
            fi
          fi
          
          # 3. ios 디렉토리에서 검색
          if [ -z "$IPA_FILE" ]; then
            echo "===== 3. ios 디렉토리 검색 ====="
            IPA_FILE=$(find ./ios -name "*.ipa" -type f 2>/dev/null | head -1)
            if [ -n "$IPA_FILE" ]; then
              echo "✅ ios 디렉토리에서 발견: $IPA_FILE"
            fi
          fi
          
          # 4. 전체 하위 디렉토리에서 검색 (DerivedData 제외)
          if [ -z "$IPA_FILE" ]; then
            echo "===== 4. 전체 하위 디렉토리 검색 (DerivedData 제외) ====="
            IPA_FILE=$(find . -type f -name "*.ipa" -not -path "*/DerivedData/*" -not -path "*/build/*" -not -path "*/.git/*" 2>/dev/null | head -1)
            if [ -n "$IPA_FILE" ]; then
              echo "✅ 하위 디렉토리에서 발견: $IPA_FILE"
            fi
          fi
          
          # 5. Fastlane 빌드 로그에서 경로 추출 시도
          if [ -z "$IPA_FILE" ] && [ -f /tmp/fastlane_build.log ]; then
            echo "===== 5. Fastlane 빌드 로그에서 경로 추출 ====="
            LOG_IPA_PATH=$(grep -i "\.ipa\|export.*ipa\|generated.*ipa" /tmp/fastlane_build.log | grep -oE "[^\s]+\.ipa" | head -1)
            if [ -n "$LOG_IPA_PATH" ] && [ -f "$LOG_IPA_PATH" ]; then
              IPA_FILE="$LOG_IPA_PATH"
              echo "✅ 빌드 로그에서 발견: $IPA_FILE"
            fi
          fi
          
          # IPA 파일이 발견된 경우
          if [ -n "$IPA_FILE" ] && [ -f "$IPA_FILE" ]; then
            echo "✅ IPA 파일 발견: $IPA_FILE"
            echo "파일 크기: $(ls -lh "$IPA_FILE" | awk '{print $5}')"
            echo "절대 경로: $(realpath "$IPA_FILE" 2>/dev/null || echo "$IPA_FILE")"
            # IPA 파일을 프로젝트 루트로 복사 (업로드 편의를 위해)
            cp "$IPA_FILE" ./pickplay-dev-client.ipa
            echo "✅ IPA 파일 준비 완료: ./pickplay-dev-client.ipa"
          else
            echo "::error::IPA 파일을 찾을 수 없습니다!"
            echo "===== 디버깅 정보 ====="
            echo "현재 디렉토리: $(pwd)"
            echo "프로젝트 루트 내용:"
            ls -la . | head -30
            echo ""
            echo "fastlane 디렉토리 내용:"
            ls -la ./fastlane 2>/dev/null | head -20 || echo "fastlane 디렉토리 없음"
            echo ""
            echo "ios 디렉토리 내용:"
            ls -la ./ios 2>/dev/null | head -20 || echo "ios 디렉토리 없음"
            echo ""
            echo "전체 IPA 파일 검색 결과:"
            find . -type f -name "*.ipa" 2>/dev/null | head -10 || echo "IPA 파일 없음"
            echo ""
            echo "Fastlane 빌드 로그 마지막 50줄:"
            tail -50 /tmp/fastlane_build.log 2>/dev/null || echo "빌드 로그 없음"
            exit 1
          fi

      - name: Upload Dev Client IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-client-ipa
          path: |
            ${{ env.PROJ_DIR }}/*.ipa
            ${{ env.PROJ_DIR }}/pickplay-dev-client.ipa
            ${{ env.PROJ_DIR }}/dev-client.ipa
          retention-days: 30
        if: success()
        continue-on-error: true

      - name: Dev Client build success
        run: |
          echo "✅ Dev Client 빌드 성공이다"
