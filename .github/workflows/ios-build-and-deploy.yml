name: iOS Beta (Fastlane)

on:
  push:
    branches: [main, release]
  workflow_dispatch:

jobs:
  ios-beta:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Setup Node.js (cache lockfile anywhere)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      # p8 내용을 파일로 저장 → Fastlane에서 key_filepath로 사용
      - name: Write App Store Connect API key to file
        env:
          ASC_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_P8" > "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV

      - name: Setup Ruby & tools
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Fastlane/CocoaPods/xcodeproj
        run: |
          gem install fastlane --no-document
          gem install cocoapods --no-document
          gem install xcodeproj --no-document

      # 프로젝트 디렉토리: pickplay
      - name: Detect project dir
        run: |
          if [ -f ./pickplay/ios/Podfile ]; then
            echo "PROJ_DIR=pickplay" >> $GITHUB_ENV
          elif [ -f ./ios/Podfile ]; then
            echo "PROJ_DIR=." >> $GITHUB_ENV
          else
            echo "::error::ios/Podfile not found"; exit 1
          fi
          echo "Detected PROJ_DIR=$PROJ_DIR"

      - name: Clean caches
        run: |
          rm -rf "$PROJ_DIR/node_modules"
          rm -rf "$PROJ_DIR/ios/Pods" "$PROJ_DIR/ios/Podfile.lock" "$PROJ_DIR/ios/build"
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Install JS deps (npm ci, no dev deps)
        run: |
          cd "$PROJ_DIR"
          if [ -f package-lock.json ]; then
            npm ci --omit=dev --legacy-peer-deps
          else
            echo "::warning::package-lock.json not found; running npm install"
            npm install --omit=dev --legacy-peer-deps
          fi

      - name: Install RN autolinking CLI (as prod deps)
        run: |
          cd "$PROJ_DIR"
          npm i --save --legacy-peer-deps \
            @react-native-community/cli \
            @react-native-community/cli-platform-ios \
            expo-modules-autolinking
          node -e "console.log('RN CLI:', require('@react-native-community/cli/package.json').version); console.log('CLI iOS:', require('@react-native-community/cli-platform-ios/package.json').version)"

      - name: Ensure iOS native project (conditional Expo prebuild)
        run: |
          cd "$PROJ_DIR"
          if [ -z "$(ls -1 ios/*.xcodeproj 2>/dev/null)" ]; then
            echo "🛠  No .xcodeproj found — running Expo prebuild (iOS only)..."
            npx expo prebuild --platform ios --no-install --clean
            # ✅ 커밋된 Podfile로 복원 (prebuild가 덮어썼을 수 있음)
            git checkout -- ios/Podfile || true
            echo "== ios contents after prebuild =="
            ls -la ios
          else
            echo "✅ .xcodeproj found; skipping prebuild."
          fi

      - name: Debug iOS folder
        run: |
          cd "$PROJ_DIR/ios"
          echo "== ios contents =="
          ls -la
          echo "== Xcode projects =="
          ls -1 *.xcodeproj || true

      # Pods 캐시를 pod install 이전에 두어 복원 효과를 누림
      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJ_DIR }}/ios/Pods
            ${{ env.PROJ_DIR }}/ios/Podfile.lock
          key: ${{ runner.os }}-pods-${{ hashFiles(format('{0}/ios/Podfile.lock', env.PROJ_DIR)) }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd "$PROJ_DIR/ios"
          pod install --repo-update

      # 1️⃣ 체크포인트: -G 잔여 여부 스캔 (정확히 0건 확인)
      - name: Checkpoint 1 - Scan for stray '-G' flags
        run: |
          cd "$PROJ_DIR/ios"
          echo "🔎 [Checkpoint 1] Scanning for stray '-G' flags in entire iOS directory..."
          set +e
          result=$(grep -R --line-number -E '\s-G(\s|$)' . 2>/dev/null || true)
          set -e
          if [ -n "$result" ]; then
            echo "::error::Found stray '-G' flags:"
            echo "$result"
            exit 1
          else
            echo "✅ [Checkpoint 1] No '-G' flags found (0 instances confirmed)"
          fi

      # ✅ -G 플래그 강제 제거(안전장치) - 더 강력한 검사/제거
      - name: Scrub invalid '-G' flags from xcconfigs (safety)
        run: |
          cd "$PROJ_DIR/ios"
          # 모든 xcconfig 파일 검색 및 스크럽
          find "Pods/Target Support Files" -name "*.xcconfig" -type f 2>/dev/null | while read file; do
            if grep -q " -G " "$file" 2>/dev/null; then
              perl -i -pe 's/\s-G(\s|$)/ /g' "$file"
              perl -i -pe 's/-G\s/ /g' "$file"
              perl -i -pe 's/^-G\b//g' "$file"
              echo "🧽 Scrubbed -G from: $file"
            fi
          done
          
          # 검증: 남아있는 -G 플래그 확인
          remaining=$(grep -r " -G " "Pods/Target Support Files" 2>/dev/null | wc -l || echo 0)
          if [ "$remaining" -gt 0 ]; then
            echo "::warning::Still found $remaining instances of '-G' flag"
            grep -rn " -G " "Pods/Target Support Files" 2>/dev/null | head -5
          else
            echo "👍 No -G flags found in xcconfigs."
          fi

      # Verify/patch aps-environment for Release
      - name: Verify/patch aps-environment for Release
        run: |
          set -e
          cd "$PROJ_DIR/ios"
          ENT_FILE="$(/usr/bin/find . -name '*.entitlements' -maxdepth 2 | head -n1 || true)"
          if [ -z "$ENT_FILE" ]; then
            echo "::warning::No entitlements file found; skipping check."
            exit 0
          fi
          echo "Found entitlements: $ENT_FILE"
          CURRENT=$(/usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENT_FILE" 2>/dev/null || echo "")
          echo "aps-environment in entitlements: ${CURRENT:-<none>}"
          if [ "$CURRENT" = "development" ]; then
            echo "Patching aps-environment to production"
            /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT_FILE"
            /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENT_FILE"
          fi

      # 4️⃣ 체크포인트: 스킴 공유 확인 (PickPlay 하나로 공유 확인)
      - name: Checkpoint 4 - Verify Xcode workspace & schemes
        run: |
          cd "$PROJ_DIR/ios"
          if [ -f "PickPlay.xcworkspace/contents.xcworkspacedata" ]; then
            echo "🔍 [Checkpoint 4] Verifying workspace and schemes..."
            xcodebuild -list -workspace PickPlay.xcworkspace | tee /tmp/xcode-list.txt
            if grep -q "Scheme:" /tmp/xcode-list.txt; then
              schemes=$(grep -A 100 "Schemes:" /tmp/xcode-list.txt | grep -v "Schemes:" | sed '/^$/,$d' | grep -v "^$" | sed 's/^[[:space:]]*//' || true)
              echo "✅ [Checkpoint 4] Found schemes:"
              echo "$schemes" | while read scheme; do
                if [ -n "$scheme" ]; then
                  echo "   - $scheme"
                fi
              done
              if echo "$schemes" | grep -q "PickPlay"; then
                echo "✅ [Checkpoint 4] PickPlay scheme found (shared scheme confirmed)"
              else
                echo "::warning::[Checkpoint 4] PickPlay scheme not found in list"
              fi
            fi
          else
            WS=$(ls -1 *.xcworkspace 2>/dev/null | head -n1 || true)
            if [ -n "$WS" ]; then
              echo "Detected workspace: $WS"
              xcodebuild -list -workspace "$WS"
            else
              echo "::warning::[Checkpoint 4] No .xcworkspace found yet."
            fi
          fi

      - name: Fastlane beta
        env:
          # App Store Connect
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
          # Apple/Match
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_PASSWORD: ${{ secrets.MATCH_GIT_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          KEYCHAIN_PASSWORD: actions
          # (옵션) Firebase App Distribution — 없으면 빈 값으로 넘어가도 무방
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          cd "$PROJ_DIR"
          if [ -f Gemfile ]; then
            bundle exec fastlane ios beta
          else
            fastlane ios beta
          fi
