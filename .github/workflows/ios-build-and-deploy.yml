name: iOS Beta (Fastlane)

on:
  push:
    branches: [main, release]
  workflow_dispatch:

jobs:
  ios-beta:
    runs-on: macos-14
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Setup Node.js (cache lockfile anywhere)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      # Save p8 key to temporary file for Fastlane
      - name: Write App Store Connect API key to file
        env:
          ASC_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_P8" > "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV

      - name: Setup Ruby & tools
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Fastlane/CocoaPods/xcodeproj
        run: |
          gem install fastlane --no-document
          gem install cocoapods --no-document
          gem install xcodeproj --no-document

      # 프로젝트 디렉토리 감지
      - name: Detect project dir
        run: |
          if [ -f ./pickplay/ios/Podfile ]; then
            echo "PROJ_DIR=pickplay" >> $GITHUB_ENV
          elif [ -f ./ios/Podfile ]; then
            echo "PROJ_DIR=." >> $GITHUB_ENV
          else
            echo "::error::ios/Podfile not found"; exit 1
          fi
          echo "Detected PROJ_DIR=$PROJ_DIR"

      # ✅ 캐시 및 빌드 잔재 완전 삭제
      - name: Clean caches (clean build)
        run: |
          rm -rf "$PROJ_DIR/node_modules"
          rm -rf "$PROJ_DIR/ios/Pods" "$PROJ_DIR/ios/Podfile.lock" "$PROJ_DIR/ios/build"
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          echo "✅ Clean build: 모든 Pods 및 빌드 아티팩트 제거 완료"

      - name: Install JS deps (npm ci, no dev deps)
        run: |
          cd "$PROJ_DIR"
          if [ -f package-lock.json ]; then
            npm ci --omit=dev --legacy-peer-deps
          else
            echo "::warning::package-lock.json not found; running npm install"
            npm install --omit=dev --legacy-peer-deps
          fi

      - name: Align RN/Expo package versions (expo install --fix)
        run: |
          cd "$PROJ_DIR"
          echo "📦 Running expo install --fix..."
          BEFORE=$(cat package.json 2>/dev/null | grep -E '"(react-native|expo)"' | head -2 || echo "")
          npx expo install --fix --no-interactive || true
          AFTER=$(cat package.json 2>/dev/null | grep -E '"(react-native|expo)"' | head -2 || echo "")
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::warning::expo install --fix changed package versions:"
            echo "Before: $BEFORE"
            echo "After: $AFTER"
          else
            echo "✅ No version changes detected"
          fi

      - name: Install RN autolinking CLI (prod)
        run: |
          cd "$PROJ_DIR"
          npm i --save --legacy-peer-deps \
            @react-native-community/cli \
            @react-native-community/cli-platform-ios \
            expo-modules-autolinking

      # Expo prebuild 필요 시만 실행
      - name: Ensure iOS native project (conditional Expo prebuild)
        run: |
          cd "$PROJ_DIR"
          if [ -z "$(ls -1 ios/*.xcodeproj 2>/dev/null)" ]; then
            echo "🛠  No .xcodeproj found — running Expo prebuild (iOS only)..."
            npx expo prebuild --platform ios --no-install --clean
            git checkout -- ios/Podfile || true # ✅ Podfile 되살리기
          else
            echo "✅ .xcodeproj found; skipping prebuild."
          fi

      - name: Debug iOS folder
        run: |
          cd "$PROJ_DIR/ios"
          echo "== ios contents ==" && ls -la
          echo "== Xcode projects ==" && ls -1 *.xcodeproj || true

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJ_DIR }}/ios/Pods
            ${{ env.PROJ_DIR }}/ios/Podfile.lock
          key: pods-clear-${{ hashFiles(format('{0}/ios/Podfile.lock', env.PROJ_DIR)) }}

      - name: Install CocoaPods
        run: |
          cd "$PROJ_DIR/ios"
          pod install --repo-update

      - name: Verify React Native Codegen files
        run: |
          cd "$PROJ_DIR"
          echo "🔍 Checking if React Native Codegen files were generated..."
          CODEGEN_DIR="$PROJ_DIR/ios/build/generated/ios"
          if [ ! -d "$CODEGEN_DIR" ]; then
            echo "::warning::Codegen directory not found: $CODEGEN_DIR"
            echo "Attempting to create Codegen directory structure..."
            mkdir -p "$CODEGEN_DIR/react/renderer/components"
            echo "⚠️ Codegen files may be generated during build"
          else
            echo "✅ Codegen directory found: $CODEGEN_DIR"
            FILE_COUNT=$(find "$CODEGEN_DIR" -type f | wc -l)
            echo "Found $FILE_COUNT Codegen files"
            if [ "$FILE_COUNT" -eq 0 ]; then
              echo "::warning::Codegen directory exists but contains no files"
            fi
          fi

      - name: Verify post_install cleaned BoringSSL-GRPC
        run: |
          cd "$PROJ_DIR/ios"
          if grep -R --line-number --fixed-strings " -G" Pods/Pods.xcodeproj/project.pbxproj; then
            echo "::error::Found -G in Pods project after post_install"
            exit 1
          fi
          echo "✅ No -G flags remain in Pods project"

      - name: Verify C++ standard is gnu++20 for all Pods
        run: |
          cd "$PROJ_DIR/ios"
          echo "🔍 Verifying C++20 standard is set for all Pod targets..."
          if [ ! -f "Pods/Pods.xcodeproj/project.pbxproj" ]; then
            echo "::warning::Pods project not found; skipping C++ standard check"
            exit 0
          fi

          FILE="Pods/Pods.xcodeproj/project.pbxproj"
          
          # Debug: Show what C++ standards are actually in the file
          echo "📋 Scanning for CLANG_CXX_LANGUAGE_STANDARD in project.pbxproj..."
          CXX_STANDARDS=$(grep -i "CLANG_CXX_LANGUAGE_STANDARD" "$FILE" | head -30 || true)
          if [ -n "$CXX_STANDARDS" ]; then
            echo "Found C++ standard settings (showing first 30 lines):"
            echo "$CXX_STANDARDS" | head -30 | while IFS= read -r line; do
              echo "  $line"
            done
          else
            echo "⚠️  No CLANG_CXX_LANGUAGE_STANDARD found in project file (may use defaults)"
          fi
          
          # Check if gnu++20 or c++20 exists anywhere (Xcode project file format: CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";)
          # More flexible: look for gnu++20 or c++20 anywhere near CLANG_CXX_LANGUAGE_STANDARD
          HAS_CXX20=$(grep -iE "gnu\+\+20|c\+\+20" "$FILE" || true)
          
          if [ -z "$HAS_CXX20" ]; then
            echo "::error::No C++20 standard (gnu++20 or c++20) found in Pods project."
            echo "::error::post_install hook should have set CLANG_CXX_LANGUAGE_STANDARD = gnu++20"
            echo "::error::This will cause build failures with React Native 0.76.9+ and Hermes (requires C++20)"
            echo ""
            echo "Debug info: First 10 lines with CLANG_CXX_LANGUAGE_STANDARD:"
            grep -i "CLANG_CXX_LANGUAGE_STANDARD" "$FILE" | head -10 || echo "(none found)"
            exit 1
          fi

          # Count occurrences
          CXX20_COUNT=$(echo "$HAS_CXX20" | grep -icE "(gnu\+\+20|c\+\+20)" || echo "0")
          echo "✅ Detected C++20 standard in Pods project ($CXX20_COUNT occurrences of gnu++20/c++20)"
          
          # Show a sample of C++20 settings
          echo "Sample C++20 settings found:"
          echo "$HAS_CXX20" | head -5 | while IFS= read -r line; do
            echo "  $line"
          done
          
          # Warn if there are also old standards (but don't fail)
          OLD_STD=$(grep -iE "CLANG_CXX_LANGUAGE_STANDARD[^=]*=\s*[\"]?gnu\+\+1[0-7]|CLANG_CXX_LANGUAGE_STANDARD[^=]*=\s*[\"]?c\+\+1[0-7]" "$FILE" | head -5 || true)
          if [ -n "$OLD_STD" ]; then
            echo "::warning::Found some old C++ standards (may be overridden by gnu++20):"
            echo "$OLD_STD" | while IFS= read -r line; do
              echo "  $line"
            done
          fi

      - name: Verify critical Podspecs are resolvable
        run: |
          cd "$PROJ_DIR"
          echo "🔍 Verifying critical podspecs..."
          MISSING=0
          for podspec in "react-native-screens/RNScreens.podspec" "react-native/React-Core.podspec"; do
            if [ ! -f "node_modules/$podspec" ]; then
              echo "::warning::Podspec not found: node_modules/$podspec"
              MISSING=$((MISSING + 1))
            else
              echo "✅ Found: $podspec"
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "::warning::Some podspecs missing; may cause CocoaPods resolution issues"
          fi

      - name: Verify/patch aps-environment for Release
        run: |
          set -e
          cd "$PROJ_DIR/ios"
          ENT_FILE="$(/usr/bin/find . -name '*.entitlements' -maxdepth 2 | head -n1 || true)"
          if [ -z "$ENT_FILE" ]; then
            echo "::warning::No entitlements file found; skipping check."
            exit 0
          fi
          echo "Found entitlements: $ENT_FILE"
          CURRENT=$(/usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENT_FILE" 2>/dev/null || echo "")
          echo "aps-environment: ${CURRENT:-<none>}"
          if [ "$CURRENT" = "development" ]; then
            echo "Patching aps-environment to production"
            /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT_FILE"
          fi

      - name: Fastlane beta
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_PASSWORD: ${{ secrets.MATCH_GIT_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BRANCH: master
          KEYCHAIN_PASSWORD: actions
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          cd "$PROJ_DIR"
          if [ -f Gemfile ]; then
            bundle exec fastlane ios beta
          else
            fastlane ios beta
          fi
