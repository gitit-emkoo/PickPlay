# ========================================
# iOS 빌드 및 TestFlight 배포 워크플로우
# ========================================
# 
# ⚠️  중요: EAS Build 사용 불가로 인해 순수 GitHub Actions 사용
# 
# 문제 상황:
# - EAS Build에서 Firebase + Google Ads + Expo 조합 시 빌드 실패
# - Config Plugin으로 해결 시도했으나 계속 에러 발생
# - 따라서 순수 Xcode 빌드 방식으로 전환
#
# 빌드 과정:
# 1. Expo prebuild로 iOS 프로젝트 생성
# 2. CocoaPods로 의존성 설치
# 3. 수동 서명을 위한 인증서 및 프로파일 설정
# 4. xcodebuild로 직접 빌드 및 아카이브
# 5. IPA 내보내기 및 TestFlight 업로드
#
# 필요한 GitHub Secrets:
# - EXPO_TOKEN: Expo 계정 토큰
# - APPLE_ID: Apple Developer 계정 이메일
# - APPLE_APP_SPECIFIC_PASSWORD: 앱별 비밀번호
# - APPLE_TEAM_ID: Apple Developer 팀 ID
# - APP_STORE_CONNECT_APP_ID: App Store Connect 앱 ID
# - P12_BASE64_PART1: iOS Distribution 인증서 Base64 문자열 (0-1999자)
# - P12_BASE64_PART2: iOS Distribution 인증서 Base64 문자열 (2000-3999자)
# - P12_BASE64_PART3: iOS Distribution 인증서 Base64 문자열 (4000자 이후)
# - P12_PASSWORD: .p12 파일의 비밀번호
# - IOS_PROVISIONING_PROFILE: App Store 프로비저닝 프로파일 (.mobileprovision 파일을 base64로 인코딩)
# ========================================

name: iOS Build and Deploy to TestFlight

on:
  push:
    branches: [main, release]
  workflow_dispatch: # 수동 실행 가능

jobs:
  ios-build-and-deploy:
    runs-on: macos-latest
    
    steps:
      # 1단계: 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
        
      # 2단계: Node.js 환경 설정 (npm 캐시 사용으로 빌드 속도 향상)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      # 3단계: 의존성 설치 (npm ci로 정확한 버전 보장, peer dependency 충돌 해결)
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        
      # 4단계: Expo CLI 설치 및 설정
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          
      # 5단계: iOS 프로젝트 생성 (prebuild)
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean
        
      # 6단계: CocoaPods 의존성 설치
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          
      # 7단계: EAS Build 자동 서명 사용 (수동 서명 문제 해결)
      - name: Setup EAS Build Auto Signing
        run: |
          echo "🔐 EAS Build 자동 서명 설정 중..."
          echo "✅ 자동 서명으로 전환 - 수동 서명 문제 해결"
          
      # 8단계: EAS Build로 iOS 빌드
      - name: Build iOS with EAS
        run: |
          echo "🚀 EAS Build로 iOS 빌드 시작..."
          npx eas build --platform ios --non-interactive -allowProvisioningUpdates DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_IDENTITY="iPhone Distribution" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="*[expo]*com.pickplay.kwcc*App Store*"
          
      # 9단계: EAS Build 완료 확인
      - name: Verify EAS Build
        run: |
          echo "✅ EAS Build 완료 확인"
          echo "📋 빌드 결과는 EAS 대시보드에서 확인하세요"
          echo "📋 TestFlight 업로드는 EAS에서 자동으로 처리됩니다"
          
      # 11단계: 빌드 상태 확인 (에러 처리)
      - name: Build Status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ 빌드 성공! TestFlight에 업로드되었습니다."
          else
            echo "❌ 빌드 실패! 로그를 확인해주세요."
            exit 1
          fi