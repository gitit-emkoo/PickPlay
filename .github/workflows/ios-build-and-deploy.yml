name: iOS Beta (Fastlane)

on:
  push:
    branches: [main, release]
  workflow_dispatch:

jobs:
  ios-beta:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            pickplay/package-lock.json

      - name: Write App Store Connect API key to file
        env:
          ASC_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_P8" > "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Fastlane/CocoaPods
        run: |
          gem install fastlane --no-document
          gem install cocoapods --no-document

      - name: Clean build caches
        working-directory: pickplay
        run: |
          rm -rf node_modules
          rm -rf ios/Pods ios/Podfile.lock ios/build
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Install JS deps
        working-directory: pickplay
        run: npm ci

      - name: Install CocoaPods
        working-directory: pickplay/ios
        run: pod install --repo-update

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            pickplay/ios/Pods
            pickplay/ios/Podfile.lock
          key: ${{ runner.os }}-pods-${{ hashFiles('pickplay/ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Fastlane beta
        working-directory: pickplay
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_PASSWORD: ${{ secrets.MATCH_GIT_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: fastlane ios beta