# ========================================
# iOS 빌드 및 TestFlight 배포 워크플로우
# ========================================
# 
# ⚠️  중요: EAS Build 사용 불가로 인해 순수 GitHub Actions 사용
# 
# 문제 상황:
# - EAS Build에서 Firebase + Google Ads + Expo 조합 시 빌드 실패
# - Config Plugin으로 해결 시도했으나 계속 에러 발생
# - 따라서 순수 Xcode 빌드 방식으로 전환
#
# 빌드 과정:
# 1. Expo prebuild로 iOS 프로젝트 생성
# 2. CocoaPods로 의존성 설치
# 3. 수동 서명을 위한 인증서 및 프로파일 설정
# 4. xcodebuild로 직접 빌드 및 아카이브
# 5. IPA 내보내기 및 TestFlight 업로드
#
# 필요한 GitHub Secrets:
# - EXPO_TOKEN: Expo 계정 토큰
# - APPLE_ID: Apple Developer 계정 이메일
# - APPLE_APP_SPECIFIC_PASSWORD: 앱별 비밀번호
# - APPLE_TEAM_ID: Apple Developer 팀 ID
# - APP_STORE_CONNECT_APP_ID: App Store Connect 앱 ID
# - P12_BASE64_PART1: iOS Distribution 인증서 Base64 문자열 (0-1999자)
# - P12_BASE64_PART2: iOS Distribution 인증서 Base64 문자열 (2000-3999자)
# - P12_BASE64_PART3: iOS Distribution 인증서 Base64 문자열 (4000자 이후)
# - P12_PASSWORD: .p12 파일의 비밀번호
# - IOS_PROVISIONING_PROFILE: App Store 프로비저닝 프로파일 (.mobileprovision 파일을 base64로 인코딩)
# ========================================

name: iOS Build and Deploy to TestFlight

on:
  push:
    branches: [main, release]
  workflow_dispatch: # 수동 실행 가능

jobs:
  ios-build-and-deploy:
    runs-on: macos-latest
    
    steps:
      # 1단계: 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
        
      # 2단계: Node.js 환경 설정 (npm 캐시 사용으로 빌드 속도 향상)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      # 3단계: 의존성 설치 (npm ci로 정확한 버전 보장, peer dependency 충돌 해결)
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        
      # 4단계: Expo CLI 설치 및 설정
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          
      # 5단계: iOS 프로젝트 생성 (prebuild)
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean
        
      # 6단계: CocoaPods 의존성 설치
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          
      # 7단계: Fastlane 설치 및 설정
      - name: Setup Fastlane
        run: |
          echo "🚀 Fastlane 설치 중..."
          sudo gem install fastlane
          
      # 8단계: Fastlane으로 인증서 및 프로파일 관리
      - name: Setup Code Signing with Fastlane
        run: |
          echo "🔐 Fastlane으로 코드 서명 설정 중..."
          
          # Fastlane 초기화 (이미 있다면 건너뛰기)
          if [ ! -f "fastlane/Fastfile" ]; then
            fastlane init
          fi
          
          # 인증서 및 프로파일을 키체인에 설치
          echo "📋 인증서 설치 중..."
          
          # 1. Base64 문자열 병합
          printf "%s%s%s" "${{ secrets.P12_BASE64_PART1 }}" "${{ secrets.P12_BASE64_PART2 }}" "${{ secrets.P12_BASE64_PART3 }}" > certificate_merged.b64
          
          # 2. Base64 디코딩
          base64 -D -i certificate_merged.b64 -o certificate.p12
          
          # 3. Fastlane으로 키체인 생성 및 인증서 설치
          fastlane run create_keychain name:"build" password:"temp123" default_keychain:true unlock:true timeout:3600
          
          # 4. 비밀번호 정제 후 인증서 가져오기
          CLEAN_PASSWORD=$(printf '%s' "${{ secrets.P12_PASSWORD }}" | sed 's/[[:space:]]*$//' | tr -d '\n\r\t ')
          fastlane run import_certificate certificate_path:"certificate.p12" certificate_password:"$CLEAN_PASSWORD" keychain_name:"build"
          
          echo "✅ 인증서 설치 완료!"
          
          # 프로비저닝 프로파일 설치
          echo "📋 프로비저닝 프로파일 설치 중..."
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 -D > provisioning_profile.mobileprovision
          fastlane run install_provisioning_profile path:"provisioning_profile.mobileprovision"
          
      # 9단계: Fastlane으로 iOS 빌드 및 TestFlight 업로드
      - name: Build and Deploy with Fastlane
        run: |
          echo "🚀 Fastlane으로 빌드 및 배포 시작..."
          
          # Fastlane으로 빌드 및 TestFlight 업로드
          fastlane run build_app \
            workspace:"ios/PickPlay.xcworkspace" \
            scheme:"PickPlay" \
            configuration:"Release" \
            export_method:"app-store" \
            export_options:"ios/ExportOptions.plist"
          
          echo "✅ 빌드 및 TestFlight 업로드 완료!"
          
      # 11단계: 빌드 상태 확인 (에러 처리)
      - name: Build Status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ 빌드 성공! TestFlight에 업로드되었습니다."
          else
            echo "❌ 빌드 실패! 로그를 확인해주세요."
            exit 1
          fi