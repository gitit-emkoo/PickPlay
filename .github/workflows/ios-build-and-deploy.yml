# ========================================
# iOS 빌드 및 TestFlight 배포 워크플로우
# ========================================
# 
# ⚠️  중요: EAS Build 사용 불가로 인해 순수 GitHub Actions 사용
# 
# 문제 상황:
# - EAS Build에서 Firebase + Google Ads + Expo 조합 시 빌드 실패
# - Config Plugin으로 해결 시도했으나 계속 에러 발생
# - 따라서 순수 Xcode 빌드 방식으로 전환
#
# 빌드 과정:
# 1. Expo prebuild로 iOS 프로젝트 생성
# 2. CocoaPods로 의존성 설치
# 3. Fastlane으로 인증서 및 프로파일 설정
# 4. Fastlane으로 빌드 및 TestFlight 업로드
#
# 필요한 GitHub Secrets (Fastlane Match 사용):
# - EXPO_TOKEN: Expo 계정 토큰
# - APPLE_TEAM_ID: Apple Developer 팀 ID
# - MATCH_GIT_URL: Fastlane Match용 Git 저장소 URL
# - MATCH_GIT_USERNAME: Git 저장소 사용자명
# - MATCH_GIT_PASSWORD: Git 저장소 비밀번호/토큰
# - MATCH_PASSWORD: Fastlane Match 암호화 비밀번호
# - APP_STORE_CONNECT_API_KEY_ID: App Store Connect API Key ID
# - APP_STORE_CONNECT_API_ISSUER_ID: App Store Connect API Issuer ID
# - APP_STORE_CONNECT_API_KEY: App Store Connect API Key (.p8 파일 내용)
# ========================================

name: iOS Build and Deploy to TestFlight

on:
  push:
    branches: [main, release]
  workflow_dispatch: # 수동 실행 가능

jobs:
  ios-build-and-deploy:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: pickplay
    
    steps:
      # 1단계: 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: pickplay
        
      # 2단계: Node.js 환경 설정 (npm 캐시 사용으로 빌드 속도 향상)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      # 3단계: 의존성 설치 (npm ci로 정확한 버전 보장, peer dependency 충돌 해결)
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        
      # 4단계: Expo CLI 설치 및 설정 (원래 방식으로 복원)
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          
      # 5단계: Xcode 버전 설정 및 iOS 프로젝트 생성
      - name: Setup Xcode and Prebuild iOS
        run: |
          # 사용 가능한 Xcode 버전 확인
          echo "🔍 사용 가능한 Xcode 버전 확인 중..."
          ls -la /Applications/ | grep -i xcode
          
          # 최신 Xcode 버전 자동 선택
          LATEST_XCODE=$(ls /Applications/ | grep -i xcode | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "📱 최신 Xcode 버전 선택: $LATEST_XCODE"
            sudo xcode-select -s "/Applications/$LATEST_XCODE"
          else
            echo "⚠️ Xcode를 찾을 수 없습니다. 기본 버전 사용"
          fi
          
          xcodebuild -version
          
          # iOS 프로젝트 생성
          echo "🔄 iOS 프로젝트 생성 중..."
          npx expo prebuild --platform ios --clean
          echo "✅ iOS 프로젝트 생성 완료"
          
          # Expo prebuild 후 fastlane 디렉토리 복원 (중요!)
          echo "🔧 fastlane 디렉토리 복원 중..."
          if [ ! -d "ios/fastlane" ]; then
            echo "📁 fastlane 디렉토리가 없습니다. 복원 중..."
            mkdir -p ios/fastlane
            cp fastlane-template.rb ios/fastlane/Fastfile
            if [ -f "appfile-template.rb" ]; then
              cp appfile-template.rb ios/fastlane/Appfile
            fi
            echo "✅ fastlane 디렉토리 복원 완료"
          else
            echo "✅ fastlane 디렉토리가 이미 존재합니다."
          fi
        
      # 6단계: CocoaPods 의존성 설치 및 SwiftLint 설정
      - name: Install CocoaPods and SwiftLint
        run: |
          cd ios
          # 기존 Pods 캐시 정리 (더 강력한 정리)
          rm -rf Pods/
          rm -f Podfile.lock
          rm -rf build/
          rm -rf DerivedData/
          rm -rf ~/Library/Developer/Xcode/DerivedData/
          rm -rf ~/Library/Caches/CocoaPods/
          
          # React Native 의존성 정리 (New Architecture 충돌 방지)
          echo "🧹 React Native 의존성 정리 중..."
          pod deintegrate || echo "deintegrate 실패 (무시하고 계속)"
          
          # 메모리 정리 (빌드 안정성 향상)
          sudo purge
          
          # 새로 설치 (재시도 로직 포함)
          for i in {1..3}; do
            echo "CocoaPods 설치 시도 $i..."
            pod install --repo-update && break || echo "시도 $i 실패, 재시도 중..."
            sleep 10
          done
          
          # SwiftLint 설치 (성공 사례에서 권장)
          echo "🔍 SwiftLint 설치 중..."
          brew install swiftlint
          
          # SwiftLint 실행 (코드 품질 검사) - 설정 파일 사용
          echo "🔍 SwiftLint 코드 품질 검사 중..."
          swiftlint --config ../.swiftlint.yml || echo "⚠️ SwiftLint 경고가 있지만 계속 진행합니다."
          
      # 7단계: Fastlane 설치 및 설정 복원 (성공 사례 방식 적용)
      - name: Setup Fastlane
        run: |
          echo "🚀 Fastlane 설치 중..."
          sudo gem install fastlane
          
          echo "📋 fastlane 디렉토리 생성 중..."
          # Fastlane 디렉토리를 프로젝트 루트에 생성 (공식 권장사항)
          mkdir -p fastlane
          cp fastlane-template.rb fastlane/Fastfile
          if [ -f "appfile-template.rb" ]; then
            cp appfile-template.rb fastlane/Appfile
          fi
          
          # ExportOptions.plist 동적 생성 (teamID 포함)
          echo '<?xml version="1.0" encoding="UTF-8"?>' > ios/ExportOptions.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ios/ExportOptions.plist
          echo '<plist version="1.0">' >> ios/ExportOptions.plist
          echo '<dict>' >> ios/ExportOptions.plist
          echo '	<key>method</key>' >> ios/ExportOptions.plist
          echo '	<string>app-store</string>' >> ios/ExportOptions.plist
          echo '	<key>teamID</key>' >> ios/ExportOptions.plist
          echo '	<string>${{ secrets.APPLE_TEAM_ID }}</string>' >> ios/ExportOptions.plist
          echo '	<key>uploadBitcode</key>' >> ios/ExportOptions.plist
          echo '	<false/>' >> ios/ExportOptions.plist
          echo '	<key>uploadSymbols</key>' >> ios/ExportOptions.plist
          echo '	<true/>' >> ios/ExportOptions.plist
          echo '	<key>compileBitcode</key>' >> ios/ExportOptions.plist
          echo '	<false/>' >> ios/ExportOptions.plist
          echo '	<key>stripSwiftSymbols</key>' >> ios/ExportOptions.plist
          echo '	<true/>' >> ios/ExportOptions.plist
          echo '	<key>thinning</key>' >> ios/ExportOptions.plist
          echo '	<string>&lt;none&gt;</string>' >> ios/ExportOptions.plist
          echo '</dict>' >> ios/ExportOptions.plist
          echo '</plist>' >> ios/ExportOptions.plist
          
          # 파일 권한 설정 (성공 사례에서 중요하게 언급됨)
          chmod +x fastlane/Fastfile
          chmod 644 ios/ExportOptions.plist
          
          echo "✅ 파일 복원 완료!"
          
      # 8단계: Fastlane 설정 확인
      - name: Verify Fastlane Setup
        run: |
          echo "🔧 Fastlane 설정 확인 중..."
          
          # 현재 디렉토리 확인
          echo "📁 현재 디렉토리: $(pwd)"
          echo "📁 디렉토리 내용:"
          ls -la
          
          # ios 디렉토리 확인
          echo "📁 ios 디렉토리 내용:"
          ls -la ios/
          
          # fastlane 디렉토리 확인
          echo "📁 fastlane 디렉토리 내용:"
          ls -la fastlane/ || echo "fastlane 디렉토리가 없습니다"
          
          # Fastfile 존재 확인
          if [ -f "fastlane/Fastfile" ]; then
            echo "✅ Fastfile이 존재합니다."
            echo "📋 Fastfile 내용 확인:"
            head -10 fastlane/Fastfile
          else
            echo "❌ Fastfile이 없습니다. 저장소에 추가해야 합니다."
            exit 1
          fi
          
      # 9단계: Fastlane Match 설정 (인증서 자동 관리)
      - name: Setup Fastlane Match
        run: |
          echo "🔐 Fastlane Match 설정 중..."
          
          # Match를 위한 Git 저장소 설정 확인
          if [ -z "${{ secrets.MATCH_GIT_URL }}" ]; then
            echo "❌ MATCH_GIT_URL이 설정되지 않았습니다."
            echo "🔧 GitHub Secrets에 MATCH_GIT_URL을 설정해주세요."
            exit 1
          fi
          
          if [ -z "${{ secrets.MATCH_GIT_USERNAME }}" ]; then
            echo "❌ MATCH_GIT_USERNAME이 설정되지 않았습니다."
            echo "🔧 GitHub Secrets에 MATCH_GIT_USERNAME을 설정해주세요."
            exit 1
          fi
          
          if [ -z "${{ secrets.MATCH_GIT_PASSWORD }}" ]; then
            echo "❌ MATCH_GIT_PASSWORD가 설정되지 않았습니다."
            echo "🔧 GitHub Secrets에 MATCH_GIT_PASSWORD를 설정해주세요."
            exit 1
          fi
          
          echo "✅ Fastlane Match 설정 완료"
          
      # 10단계: Fastlane Match 초기화 (첫 실행 시에만)
      - name: Initialize Fastlane Match
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_PASSWORD: ${{ secrets.MATCH_GIT_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          echo "🔐 Fastlane Match 초기화 중..."
          echo "🔄 워크플로우 업데이트 확인 - 디버깅 로그 포함 버전"
          # Fastlane이 프로젝트 루트의 fastlane/에서 실행되므로 cd ios 필요 없음
          
          # 키체인 생성 및 설정
          echo "🔑 키체인 생성 및 설정 중..."
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -t 3600 -l ~/Library/Keychains/build.keychain
          echo "✅ 키체인 생성 완료"
          
          # Xcode 버전 확인 및 설정
          echo "🔍 Xcode 버전 확인 중..."
          xcodebuild -version
          ls -la /Applications/ | grep -i xcode
          echo "✅ Xcode 버전 확인 완료"
          
           # Expo prebuild (네이티브 파일 최신화) - 먼저 실행
           echo "🔄 Expo prebuild 실행 중..."
           cd ..
           npx expo prebuild --platform ios --clean
           cd ios
           echo "✅ Expo prebuild 완료"
           
           # CocoaPods 의존성 업데이트 및 workspace 생성 (Expo prebuild 후 실행)
           echo "📦 CocoaPods 의존성 업데이트 및 workspace 생성 중..."
           
           # 시스템 환경 확인
           echo "🔍 시스템 환경 확인 중..."
           df -h # 디스크 공간 확인
           ls -la # 현재 디렉토리 상태 확인
           
           # Podfile 존재 확인
           if [ ! -f "Podfile" ]; then
             echo "❌ Podfile이 존재하지 않습니다!"
             exit 1
           fi
           
           # PickPlay.xcworkspace 번들 내부 핵심 파일로 검증 (가장 안전한 방법)
           echo "🔍 PickPlay.xcworkspace 번들 확인 중..."
           if [ -f "PickPlay.xcworkspace/contents.xcworkspacedata" ]; then
             echo "✅ PickPlay.xcworkspace 번들이 존재합니다."
           else
             echo "❌ PickPlay.xcworkspace 번들이 올바르지 않습니다. CocoaPods로 강제 재생성 중..."
             
             # 기존 workspace 및 Pods 완전 정리 (React Native 권장사항)
             echo "🧹 기존 workspace 및 Pods 완전 정리 중..."
             rm -rf PickPlay.xcworkspace Pods Podfile.lock
             # 주의: PickPlay.xcodeproj는 삭제하지 않음 (pod deintegrate가 필요로 함)
             
             # CocoaPods 완전 정리 (React Native 권장사항)
             echo "🧹 CocoaPods 캐시 및 설정 완전 정리 중..."
             pod cache clean --all
             
             # pod deintegrate 실행 (xcodeproj 파일이 존재할 때만)
             if [ -f "PickPlay.xcodeproj" ]; then
               echo "🔧 Xcode 프로젝트에서 Pods 설정 제거 중..."
               pod deintegrate PickPlay.xcodeproj # 프로젝트 파일 경로 명시
             else
               echo "⚠️ PickPlay.xcodeproj 파일이 없습니다. pod deintegrate 건너뜀"
             fi
             
             # CocoaPods 재설치 (여러 방법 시도)
             echo "📦 CocoaPods 재설치 시도 1: 기본 설치"
             pod install --repo-update
             
             # workspace 생성 확인
             if [ -f "PickPlay.xcworkspace/contents.xcworkspacedata" ]; then
               echo "✅ PickPlay.xcworkspace 번들 생성 완료"
             else
               echo "⚠️ 첫 번째 시도 실패, 두 번째 시도 중..."
               echo "📦 CocoaPods 재설치 시도 2: 클린 설치"
               pod install --clean-install
               
               if [ -f "PickPlay.xcworkspace/contents.xcworkspacedata" ]; then
                 echo "✅ PickPlay.xcworkspace 번들 생성 완료 (두 번째 시도)"
               else
                 echo "⚠️ 두 번째 시도 실패, 세 번째 시도 중..."
                 echo "📦 CocoaPods 재설치 시도 3: 강제 재설치"
                 pod install --verbose --repo-update
                 
                 if [ -f "PickPlay.xcworkspace/contents.xcworkspacedata" ]; then
                   echo "✅ PickPlay.xcworkspace 번들 생성 완료 (세 번째 시도)"
                 else
                   echo "❌ 모든 시도 실패. 디렉토리 상태 확인 중..."
                   ls -la
                   ls -la PickPlay.xcworkspace/ 2>/dev/null || echo "PickPlay.xcworkspace 디렉토리가 존재하지 않습니다."
                   ls -la Pods/ 2>/dev/null || echo "Pods 디렉토리가 존재하지 않습니다."
                   exit 1
                 fi
               fi
             fi
           fi
           
           echo "✅ CocoaPods 의존성 업데이트 완료"
           
           # ExportOptions.plist 파일 동적 생성 (Expo prebuild로 인해 삭제됨)
           echo "📄 ExportOptions.plist 파일 동적 생성 중..."
           echo '<?xml version="1.0" encoding="UTF-8"?>' > ExportOptions.plist
           echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ExportOptions.plist
           echo '<plist version="1.0">' >> ExportOptions.plist
           echo '<dict>' >> ExportOptions.plist
           echo '	<key>method</key>' >> ExportOptions.plist
           echo '	<string>app-store</string>' >> ExportOptions.plist
           echo '	<key>teamID</key>' >> ExportOptions.plist
           echo "	<string>$APPLE_TEAM_ID</string>" >> ExportOptions.plist
           echo '	<key>uploadBitcode</key>' >> ExportOptions.plist
           echo '	<false/>' >> ExportOptions.plist
           echo '	<key>uploadSymbols</key>' >> ExportOptions.plist
           echo '	<true/>' >> ExportOptions.plist
           echo '	<key>compileBitcode</key>' >> ExportOptions.plist
           echo '	<false/>' >> ExportOptions.plist
           echo '	<key>stripSwiftSymbols</key>' >> ExportOptions.plist
           echo '	<true/>' >> ExportOptions.plist
           echo '	<key>thinning</key>' >> ExportOptions.plist
           echo '	<string>&lt;none&gt;</string>' >> ExportOptions.plist
           echo '</dict>' >> ExportOptions.plist
           echo '</plist>' >> ExportOptions.plist
           chmod 644 ExportOptions.plist
           echo "✅ ExportOptions.plist 파일 동적 생성 완료"
          
          # 모든 환경변수 디버깅 정보 출력
          echo "🔍 ===== 전체 환경변수 디버깅 정보 ====="
          echo "🔍 APPLE_TEAM_ID 정보:"
          echo "  - 길이: ${#APPLE_TEAM_ID}자"
          echo "  - 앞 4자리: ${APPLE_TEAM_ID:0:4}"
          echo "  - 뒤 4자리: ${APPLE_TEAM_ID: -4}"
          
          echo "🔍 APP_STORE_CONNECT_API_KEY_ID 정보:"
          echo "  - 길이: ${#APP_STORE_CONNECT_API_KEY_ID}자"
          echo "  - 앞 4자리: ${APP_STORE_CONNECT_API_KEY_ID:0:4}"
          echo "  - 뒤 4자리: ${APP_STORE_CONNECT_API_KEY_ID: -4}"
          
          echo "🔍 APP_STORE_CONNECT_API_ISSUER_ID 정보:"
          echo "  - 길이: ${#APP_STORE_CONNECT_API_ISSUER_ID}자"
          echo "  - 앞 4자리: ${APP_STORE_CONNECT_API_ISSUER_ID:0:4}"
          echo "  - 뒤 4자리: ${APP_STORE_CONNECT_API_ISSUER_ID: -4}"
          
          echo "🔍 MATCH_GIT_URL 정보:"
          echo "  - 길이: ${#MATCH_GIT_URL}자"
          echo "  - 앞 20자리: ${MATCH_GIT_URL:0:20}"
          echo "  - 뒤 10자리: ${MATCH_GIT_URL: -10}"
          
          echo "🔍 MATCH_GIT_USERNAME 정보:"
          echo "  - 길이: ${#MATCH_GIT_USERNAME}자"
          echo "  - 앞 10자리: ${MATCH_GIT_USERNAME:0:10}"
          echo "  - 뒤 10자리: ${MATCH_GIT_USERNAME: -10}"
          
          echo "🔍 MATCH_GIT_PASSWORD 정보:"
          echo "  - 길이: ${#MATCH_GIT_PASSWORD}자"
          echo "  - 앞 4자리: ${MATCH_GIT_PASSWORD:0:4}"
          echo "  - 뒤 4자리: ${MATCH_GIT_PASSWORD: -4}"
          
          echo "🔍 ===== 비밀번호 정제 전후 비교 ====="
          
          # 비밀번호 정제 (공백 및 특수문자 제거)
          echo "🔧 비밀번호 정제 중..."
          CLEAN_MATCH_PASSWORD=$(echo "$MATCH_PASSWORD" | tr -d '[:space:]')
          
          # 비밀번호 정보 로그 출력 (디버깅용)
          echo "🔍 MATCH_PASSWORD 정보:"
          echo "  - 원본 길이: ${#MATCH_PASSWORD}자"
          echo "  - 정제 후 길이: ${#CLEAN_MATCH_PASSWORD}자"
          echo "  - 앞 4자리: ${CLEAN_MATCH_PASSWORD:0:4}"
          echo "  - 뒤 4자리: ${CLEAN_MATCH_PASSWORD: -4}"
          echo "  - 정제 전후 비교: 원본[${#MATCH_PASSWORD}] → 정제[${#CLEAN_MATCH_PASSWORD}]"
          
          echo "🔍 ===== 환경변수 검증 결과 ====="
          echo "✅ APPLE_TEAM_ID: ${#APPLE_TEAM_ID}자 (예상: 10자)"
          echo "✅ APP_STORE_CONNECT_API_KEY_ID: ${#APP_STORE_CONNECT_API_KEY_ID}자 (예상: 10자)"
          echo "✅ APP_STORE_CONNECT_API_ISSUER_ID: ${#APP_STORE_CONNECT_API_ISSUER_ID}자 (예상: UUID 길이)"
          echo "✅ MATCH_PASSWORD: ${#CLEAN_MATCH_PASSWORD}자 (예상: 10자)"
          echo "✅ MATCH_GIT_URL: ${#MATCH_GIT_URL}자 (예상: URL 길이)"
          echo "✅ MATCH_GIT_USERNAME: ${#MATCH_GIT_USERNAME}자 (예상: 사용자명 길이)"
          echo "✅ MATCH_GIT_PASSWORD: ${#MATCH_GIT_PASSWORD}자 (예상: 토큰 길이)"
          
          echo "🔍 ===== 상세 진단 테스트 ====="
          
          # App Store Connect API Key 접근 테스트
          echo "🧪 App Store Connect API Key 접근 테스트 중..."
          echo "  - Key ID: $APP_STORE_CONNECT_API_KEY_ID"
          echo "  - Issuer ID: $APP_STORE_CONNECT_API_ISSUER_ID"
          echo "  - Team ID: $APPLE_TEAM_ID"
          
          # Git 저장소 접근 테스트
          echo "🧪 Git 저장소 접근 테스트 중..."
          echo "  - URL: ${MATCH_GIT_URL:0:20}...${MATCH_GIT_URL: -10}"
          echo "  - 사용자: $MATCH_GIT_USERNAME"
          echo "  - 토큰: ${MATCH_GIT_PASSWORD:0:4}...${MATCH_GIT_PASSWORD: -4}"
          
          # Match 설정 확인
          echo "🧪 Match 설정 확인 중..."
          echo "  - MATCH_PASSWORD: ${CLEAN_MATCH_PASSWORD:0:4}...${CLEAN_MATCH_PASSWORD: -4}"
          echo "  - MATCH_GIT_URL: ${MATCH_GIT_URL:0:20}...${MATCH_GIT_URL: -10}"
          echo "  - MATCH_GIT_USERNAME: $MATCH_GIT_USERNAME"
          echo "  - MATCH_GIT_PASSWORD: ${MATCH_GIT_PASSWORD:0:4}...${MATCH_GIT_PASSWORD: -4}"
          
          # 정제된 비밀번호로 환경변수 재설정
          export MATCH_PASSWORD="$CLEAN_MATCH_PASSWORD"
          export APPLE_TEAM_ID="$APPLE_TEAM_ID"
          
          echo "✅ 비밀번호 정제 완료"
          
          echo "🔍 ===== Fastlane Match 실행 전 최종 확인 ====="
          echo "📋 실행할 명령어: fastlane match_init"
          echo "📋 사용할 환경변수:"
          echo "  - APPLE_TEAM_ID: $APPLE_TEAM_ID"
          echo "  - APP_STORE_CONNECT_API_KEY_ID: $APP_STORE_CONNECT_API_KEY_ID"
          echo "  - APP_STORE_CONNECT_API_ISSUER_ID: $APP_STORE_CONNECT_API_ISSUER_ID"
          echo "  - MATCH_PASSWORD: ${CLEAN_MATCH_PASSWORD:0:4}...${CLEAN_MATCH_PASSWORD: -4}"
          echo "  - MATCH_GIT_URL: ${MATCH_GIT_URL:0:20}...${MATCH_GIT_URL: -10}"
          echo "  - MATCH_GIT_USERNAME: $MATCH_GIT_USERNAME"
          echo "  - MATCH_GIT_PASSWORD: ${MATCH_GIT_PASSWORD:0:4}...${MATCH_GIT_PASSWORD: -4}"
          
           echo "🚀 Fastlane Match 초기화 시작..."
           
           # Fastlane 디렉토리 확인 및 생성
           echo "🔍 Fastlane 디렉토리 확인 중..."
           if [ ! -d "fastlane" ]; then
             echo "❌ fastlane 디렉토리가 없습니다. 생성 중..."
             mkdir -p fastlane
             cp ../fastlane-template.rb fastlane/Fastfile
             cp ../appfile-template.rb fastlane/Appfile
             chmod +x fastlane/Fastfile
             chmod +x fastlane/Appfile
             echo "✅ fastlane 디렉토리 및 설정 파일 생성 완료"
           else
             echo "✅ fastlane 디렉토리가 존재합니다."
           fi
           
           # ExportOptions.plist 파일 확인 (Git에 커밋된 파일 사용)
           echo "📄 ExportOptions.plist 파일 확인 중..."
           if [ -f "ExportOptions.plist" ]; then
             echo "✅ ExportOptions.plist 파일이 존재합니다."
           else
             echo "❌ ExportOptions.plist 파일이 없습니다. Git에 커밋된 파일을 확인해주세요."
             exit 1
           fi
           
           # 현재 디렉토리 및 fastlane 디렉토리 내용 확인
           echo "📁 현재 디렉토리: $(pwd)"
           echo "📁 fastlane 디렉토리 내용:"
           ls -la fastlane/
           
           # Match 초기화 실행 (상세 로그 포함)
           fastlane match_init --verbose
          
          echo "✅ Fastlane Match 초기화 완료!"
          
      # 11단계: Fastlane으로 빌드 및 배포 (Match 사용)
      - name: Build and Deploy with Fastlane Match
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_PASSWORD: ${{ secrets.MATCH_GIT_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          echo "🚀 Fastlane Match로 빌드 및 배포 시작..."
          cd ios
          
          # 비밀번호 정제 (공백 및 특수문자 제거)
          echo "🔧 비밀번호 정제 중..."
          CLEAN_FASTLANE_PASSWORD=$(echo "$FASTLANE_PASSWORD" | tr -d '[:space:]')
          CLEAN_MATCH_PASSWORD=$(echo "$MATCH_PASSWORD" | tr -d '[:space:]')
          CLEAN_APPLE_APP_SPECIFIC_PASSWORD=$(echo "$APPLE_APP_SPECIFIC_PASSWORD" | tr -d '[:space:]')
          
          # 비밀번호 정보 로그 출력 (디버깅용)
          echo "🔍 FASTLANE_PASSWORD 정보:"
          echo "  - 원본 길이: ${#FASTLANE_PASSWORD}자"
          echo "  - 정제 후 길이: ${#CLEAN_FASTLANE_PASSWORD}자"
          echo "  - 앞 4자리: ${CLEAN_FASTLANE_PASSWORD:0:4}"
          echo "  - 뒤 4자리: ${CLEAN_FASTLANE_PASSWORD: -4}"
          
          echo "🔍 MATCH_PASSWORD 정보:"
          echo "  - 원본 길이: ${#MATCH_PASSWORD}자"
          echo "  - 정제 후 길이: ${#CLEAN_MATCH_PASSWORD}자"
          echo "  - 앞 4자리: ${CLEAN_MATCH_PASSWORD:0:4}"
          echo "  - 뒤 4자리: ${CLEAN_MATCH_PASSWORD: -4}"
          
          echo "🔍 APPLE_APP_SPECIFIC_PASSWORD 정보:"
          echo "  - 원본 길이: ${#APPLE_APP_SPECIFIC_PASSWORD}자"
          echo "  - 정제 후 길이: ${#CLEAN_APPLE_APP_SPECIFIC_PASSWORD}자"
          echo "  - 앞 4자리: ${CLEAN_APPLE_APP_SPECIFIC_PASSWORD:0:4}"
          echo "  - 뒤 4자리: ${CLEAN_APPLE_APP_SPECIFIC_PASSWORD: -4}"
          
          # 정제된 비밀번호로 환경변수 재설정
          export FASTLANE_USER="$FASTLANE_USER"
          export FASTLANE_PASSWORD="$CLEAN_FASTLANE_PASSWORD"
          export MATCH_PASSWORD="$CLEAN_MATCH_PASSWORD"
          export APPLE_APP_SPECIFIC_PASSWORD="$CLEAN_APPLE_APP_SPECIFIC_PASSWORD"
          export APPLE_TEAM_ID="$APPLE_TEAM_ID"
          
           echo "✅ 비밀번호 정제 완료"
           
           # Fastlane 디렉토리 확인 및 생성
           echo "🔍 Fastlane 디렉토리 확인 중..."
           if [ ! -d "fastlane" ]; then
             echo "❌ fastlane 디렉토리가 없습니다. 생성 중..."
             mkdir -p fastlane
             cp ../fastlane-template.rb fastlane/Fastfile
             cp ../appfile-template.rb fastlane/Appfile
             chmod +x fastlane/Fastfile
             chmod +x fastlane/Appfile
             echo "✅ fastlane 디렉토리 및 설정 파일 생성 완료"
           else
             echo "✅ fastlane 디렉토리가 존재합니다."
           fi
           
           # ExportOptions.plist 파일 동적 생성 (Expo prebuild로 인해 삭제됨)
           echo "📄 ExportOptions.plist 파일 동적 생성 중..."
           echo '<?xml version="1.0" encoding="UTF-8"?>' > ExportOptions.plist
           echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ExportOptions.plist
           echo '<plist version="1.0">' >> ExportOptions.plist
           echo '<dict>' >> ExportOptions.plist
           echo '	<key>method</key>' >> ExportOptions.plist
           echo '	<string>app-store</string>' >> ExportOptions.plist
           echo '	<key>teamID</key>' >> ExportOptions.plist
           echo "	<string>$APPLE_TEAM_ID</string>" >> ExportOptions.plist
           echo '	<key>uploadBitcode</key>' >> ExportOptions.plist
           echo '	<false/>' >> ExportOptions.plist
           echo '	<key>uploadSymbols</key>' >> ExportOptions.plist
           echo '	<true/>' >> ExportOptions.plist
           echo '	<key>compileBitcode</key>' >> ExportOptions.plist
           echo '	<false/>' >> ExportOptions.plist
           echo '	<key>stripSwiftSymbols</key>' >> ExportOptions.plist
           echo '	<true/>' >> ExportOptions.plist
           echo '	<key>thinning</key>' >> ExportOptions.plist
           echo '	<string>&lt;none&gt;</string>' >> ExportOptions.plist
           echo '</dict>' >> ExportOptions.plist
           echo '</plist>' >> ExportOptions.plist
           chmod 644 ExportOptions.plist
           echo "✅ ExportOptions.plist 파일 동적 생성 완료"
           
           # Fastlane Match를 사용한 빌드 실행
           fastlane beta
          
          echo "✅ 빌드 및 TestFlight 업로드 완료!"
          
      # 11단계: 빌드 상태 확인 (에러 처리)
      - name: Build Status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ 빌드 성공! TestFlight에 업로드되었습니다."
          else
            echo "❌ 빌드 실패! 로그를 확인해주세요."
            exit 1
          fi