# ========================================
# iOS 빌드 및 TestFlight 배포 워크플로우
# ========================================
# 
# ⚠️  중요: EAS Build 사용 불가로 인해 순수 GitHub Actions 사용
# 
# 문제 상황:
# - EAS Build에서 Firebase + Google Ads + Expo 조합 시 빌드 실패
# - Config Plugin으로 해결 시도했으나 계속 에러 발생
# - 따라서 순수 Xcode 빌드 방식으로 전환
#
# 빌드 과정:
# 1. Expo prebuild로 iOS 프로젝트 생성
# 2. CocoaPods로 의존성 설치
# 3. Fastlane으로 인증서 및 프로파일 설정
# 4. Fastlane으로 빌드 및 TestFlight 업로드
#
# 필요한 GitHub Secrets (Fastlane Match 사용):
# - EXPO_TOKEN: Expo 계정 토큰
# - APPLE_TEAM_ID: Apple Developer 팀 ID
# - MATCH_GIT_URL: Fastlane Match용 Git 저장소 URL
# - MATCH_GIT_USERNAME: Git 저장소 사용자명
# - MATCH_GIT_PASSWORD: Git 저장소 비밀번호/토큰
# - MATCH_PASSWORD: Fastlane Match 암호화 비밀번호
# - APP_STORE_CONNECT_API_KEY_ID: App Store Connect API Key ID
# - APP_STORE_CONNECT_API_ISSUER_ID: App Store Connect API Issuer ID
# - APP_STORE_CONNECT_API_KEY: App Store Connect API Key (.p8 파일 내용)
# ========================================

name: iOS Build and Deploy to TestFlight

on:
  push:
    branches: [main, release]
  workflow_dispatch: # 수동 실행 가능

jobs:
  ios-build-and-deploy:
    runs-on: macos-latest
    
    steps:
      # 1단계: 코드 체크아웃 (pickplay 디렉토리)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: pickplay
        
      # 2단계: Node.js 환경 설정 (npm 캐시 사용으로 빌드 속도 향상)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pickplay/package-lock.json
          
      # 3단계: Expo CLI 설치 및 설정 (원래 방식으로 복원)
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          
      # 5단계: Xcode 버전 설정
      - name: Setup Xcode
        run: |
          # 사용 가능한 Xcode 버전 확인
          echo "🔍 사용 가능한 Xcode 버전 확인 중..."
          ls -la /Applications/ | grep -i xcode
          
          # 최신 Xcode 버전 자동 선택
          LATEST_XCODE=$(ls /Applications/ | grep -i xcode | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "📱 최신 Xcode 버전 선택: $LATEST_XCODE"
            sudo xcode-select -s "/Applications/$LATEST_XCODE"
          else
            echo "⚠️ Xcode를 찾을 수 없습니다. 기본 버전 사용"
          fi
          
          xcodebuild -version
          echo "✅ Xcode 설정 완료"
        
      # 6단계: Codegen 캐시 완전 정리 (강화)
      - name: Clean Dependencies and Codegen Cache
        working-directory: pickplay
        run: |
          echo "🧹 의존성 및 Codegen 캐시 완전 정리 중..."
          
          # node_modules 제거
          rm -rf node_modules
          rm -f package-lock.json
          
          # React Native 캐시 제거
          rm -rf $TMPDIR/react-*
          
          # iOS Pods 및 Codegen 캐시 제거 (강화)
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          rm -rf build
          rm -rf DerivedData
          
          # Codegen 관련 디렉토리 완전 정리
          rm -rf build/generated
          rm -rf build/react
          
          # CocoaPods 완전 제거
          pod deintegrate || echo "deintegrate 무시"
          cd ..
          
          # Metro bundler 캐시 제거
          rm -rf .expo
          rm -rf .metro
          
          # React Native CLI 캐시 제거
          npm cache clean --force || echo "npm cache clean 무시"
          
          echo "✅ Codegen 캐시 정리 완료"
          
      # 7단계: 의존성 재설치
      - name: Reinstall Dependencies
        working-directory: pickplay
        run: |
          echo "📦 의존성 재설치 중..."
          npm install --legacy-peer-deps
          echo "✅ 의존성 재설치 완료"
          
      # 7.5단계: Expo prebuild (iOS 네이티브 파일 생성)
      - name: Expo Prebuild
        working-directory: pickplay
        run: |
          echo "🔄 Expo prebuild 실행 중 (CocoaPods 설치 전)..."
          CI=1 npx expo prebuild --platform ios --clean
          echo "✅ Expo prebuild 완료"
          
      # 7.7단계: Codegen 디렉토리 사전 생성 (빌드 오류 방지)
      - name: Pre-create Codegen Build Directories
        working-directory: pickplay
        run: |
          echo "📁 Codegen 디렉토리 사전 생성 중..."
          
          # Base 디렉토리 생성
          mkdir -p ios/build/generated/ios
          
          # Codegen이 생성할 수 있는 모든 디렉토리 구조 사전 생성
          codegen_dirs=(
            "react/renderer/components/reanimated"
            "react/renderer/components/workletscore"
            "react/renderer/components/safeareacontext"
            "react/renderer/components/googlemobileads"
            "react/renderer/components/rngesturehandler"
            "react/renderer/components/rnscreens"
          )
          
          for dir in "${codegen_dirs[@]}"; do
            mkdir -p "ios/build/generated/ios/$dir"
            echo "✅ Codegen 디렉토리 생성: ios/build/generated/ios/$dir"
          done
          
          # lottiereactnative: 더미 헤더 파일 생성
          mkdir -p "ios/build/generated/ios/react/renderer/components/lottiereactnative"
          touch "ios/build/generated/ios/react/renderer/components/lottiereactnative/States.h"
          touch "ios/build/generated/ios/react/renderer/components/lottiereactnative/ShadowNodes.h"
          touch "ios/build/generated/ios/react/renderer/components/lottiereactnative/RCTComponentViewHelpers.h"
          touch "ios/build/generated/ios/react/renderer/components/lottiereactnative/Props.h"
          echo "✅ lottiereactnative 더미 헤더 파일 생성 완료"
          
          echo "✅ Codegen 디렉토리 사전 생성 완료"
          
      # 8단계: CocoaPods 의존성 설치 및 SwiftLint 설정
      - name: Install CocoaPods and SwiftLint
        working-directory: pickplay
        run: |
          cd ios
          
          # 메모리 정리 (빌드 안정성 향상)
          sudo purge
          
          # Pods 완전 제거 (새로운 Podfile 변경사항 적용)
          echo "🧹 Pods 완전 제거 중..."
          pod deintegrate || echo "deintegrate 무시"
          rm -f Podfile.lock
          rm -rf Pods
          rm -rf PickPlay.xcworkspace
          echo "✅ Pods 완전 제거 완료"
          
          # 새로 설치 (재시도 로직 포함)
          # Reanimated 검사만 통과시키기 위해 환경변수 설정 (실제 빌드는 fabric_enabled => false로 Old Arch)
          export RCT_NEW_ARCH_ENABLED=1
          for i in {1..3}; do
            echo "CocoaPods 설치 시도 $i..."
            pod install --repo-update && break || echo "시도 $i 실패, 재시도 중..."
            sleep 10
          done
          
          # SwiftLint 설치 (성공 사례에서 권장)
          echo "🔍 SwiftLint 설치 중..."
          brew install swiftlint
          
          # SwiftLint 실행 (코드 품질 검사) - 설정 파일 사용
          echo "🔍 SwiftLint 코드 품질 검사 중..."
          swiftlint --config ../.swiftlint.yml || echo "⚠️ SwiftLint 경고가 있지만 계속 진행합니다."
          
      # 8.5단계: Codegen 디렉토리 재생성 (pod install 직후)
      - name: Post-pod Install Codegen Directories
        working-directory: pickplay
        run: |
          echo "📁 Codegen 디렉토리 재생성 중 (pod install 직후)..."
          mkdir -p ios/build/generated/ios
          
          codegen_dirs=(
            "react/renderer/components/lottiereactnative"
            "react/renderer/components/reanimated"
            "react/renderer/components/workletscore"
            "react/renderer/components/safeareacontext"
            "react/renderer/components/googlemobileads"
            "react/renderer/components/rngesturehandler"
            "react/renderer/components/rnscreens"
          )
          
          for dir in "${codegen_dirs[@]}"; do
            mkdir -p "ios/build/generated/ios/$dir"
            echo "✅ Codegen 디렉토리 생성: ios/build/generated/ios/$dir"
          done
          
          echo "✅ Codegen 디렉토리 재생성 완료 (pod install 직후)"
          
      # 9단계: Fastlane 설치 및 설정 복원 (성공 사례 방식 적용)
      - name: Setup Fastlane
        working-directory: pickplay
        run: |
          echo "🚀 Fastlane 설치 중..."
          sudo gem install fastlane
          
          echo "📋 fastlane 디렉토리 생성 중..."
          # Fastlane 디렉토리를 프로젝트 루트에 생성 (공식 권장사항)
          mkdir -p fastlane
          cp fastlane-template.rb fastlane/Fastfile
          if [ -f "appfile-template.rb" ]; then
            cp appfile-template.rb fastlane/Appfile
          fi
          
          # 파일 권한 설정 (성공 사례에서 중요하게 언급됨)
          chmod +x fastlane/Fastfile
          
          echo "✅ Fastlane 설정 완료!"
          
      # 10단계: Fastlane 설정 확인
      - name: Verify Fastlane Setup
        working-directory: pickplay
        run: |
          echo "🔧 Fastlane 설정 확인 중..."
          
          # 현재 디렉토리 확인
          echo "📁 현재 디렉토리: $(pwd)"
          echo "📁 디렉토리 내용:"
          ls -la
          
          # ios 디렉토리 확인
          echo "📁 ios 디렉토리 내용:"
          ls -la ios/
          
          # fastlane 디렉토리 확인
          echo "📁 fastlane 디렉토리 내용:"
          ls -la fastlane/ || echo "fastlane 디렉토리가 없습니다"
          
          # Fastfile 존재 확인
          if [ -f "fastlane/Fastfile" ]; then
            echo "✅ Fastfile이 존재합니다."
            echo "📋 Fastfile 내용 확인:"
            head -10 fastlane/Fastfile
          else
            echo "❌ Fastfile이 없습니다. 저장소에 추가해야 합니다."
            exit 1
          fi
          
      # 11단계: Fastlane Match 설정 (인증서 자동 관리)
      - name: Setup Fastlane Match
        working-directory: pickplay
        run: |
          echo "🔐 Fastlane Match 설정 중..."
          
          # Match를 위한 Git 저장소 설정 확인
          if [ -z "${{ secrets.MATCH_GIT_URL }}" ]; then
            echo "❌ MATCH_GIT_URL이 설정되지 않았습니다."
            echo "🔧 GitHub Secrets에 MATCH_GIT_URL을 설정해주세요."
            exit 1
          fi
          
          if [ -z "${{ secrets.MATCH_GIT_USERNAME }}" ]; then
            echo "❌ MATCH_GIT_USERNAME이 설정되지 않았습니다."
            echo "🔧 GitHub Secrets에 MATCH_GIT_USERNAME을 설정해주세요."
            exit 1
          fi
          
          if [ -z "${{ secrets.MATCH_GIT_PASSWORD }}" ]; then
            echo "❌ MATCH_GIT_PASSWORD가 설정되지 않았습니다."
            echo "🔧 GitHub Secrets에 MATCH_GIT_PASSWORD를 설정해주세요."
            exit 1
          fi
          
          echo "✅ Fastlane Match 설정 완료"
          
      # 12단계: Fastlane Match 인증서 동기화
      - name: Setup Fastlane Match Certificates
        working-directory: pickplay
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_PASSWORD: ${{ secrets.MATCH_GIT_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          echo "🔐 Fastlane Match 인증서 동기화 중..."
          
          # 키체인 생성 및 설정
          echo "🔑 키체인 생성 및 설정 중..."
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -t 3600 -l ~/Library/Keychains/build.keychain
          echo "✅ 키체인 생성 완료"
          
          # 비밀번호 정제 (공백 및 특수문자 제거)
          echo "🔧 비밀번호 정제 중..."
          CLEAN_MATCH_PASSWORD=$(echo "$MATCH_PASSWORD" | tr -d '[:space:]')
          export MATCH_PASSWORD="$CLEAN_MATCH_PASSWORD"
          
          # 모든 환경변수 디버깅 정보 출력
          echo "🔍 ===== 전체 환경변수 디버깅 정보 ====="
          echo "🔍 APPLE_TEAM_ID 정보:"
          echo "  - 길이: ${#APPLE_TEAM_ID}자"
          echo "  - 앞 4자리: ${APPLE_TEAM_ID:0:4}"
          echo "  - 뒤 4자리: ${APPLE_TEAM_ID: -4}"
          
          echo "🔍 APP_STORE_CONNECT_API_KEY_ID 정보:"
          echo "  - 길이: ${#APP_STORE_CONNECT_API_KEY_ID}자"
          echo "  - 앞 4자리: ${APP_STORE_CONNECT_API_KEY_ID:0:4}"
          echo "  - 뒤 4자리: ${APP_STORE_CONNECT_API_KEY_ID: -4}"
          
          echo "🔍 APP_STORE_CONNECT_API_ISSUER_ID 정보:"
          echo "  - 길이: ${#APP_STORE_CONNECT_API_ISSUER_ID}자"
          echo "  - 앞 4자리: ${APP_STORE_CONNECT_API_ISSUER_ID:0:4}"
          echo "  - 뒤 4자리: ${APP_STORE_CONNECT_API_ISSUER_ID: -4}"
          
          echo "🔍 MATCH_GIT_URL 정보:"
          echo "  - 길이: ${#MATCH_GIT_URL}자"
          echo "  - 앞 20자리: ${MATCH_GIT_URL:0:20}"
          echo "  - 뒤 10자리: ${MATCH_GIT_URL: -10}"
          
          echo "🔍 MATCH_GIT_USERNAME 정보:"
          echo "  - 길이: ${#MATCH_GIT_USERNAME}자"
          echo "  - 앞 10자리: ${MATCH_GIT_USERNAME:0:10}"
          echo "  - 뒤 10자리: ${MATCH_GIT_USERNAME: -10}"
          
          echo "🔍 MATCH_GIT_PASSWORD 정보:"
          echo "  - 길이: ${#MATCH_GIT_PASSWORD}자"
          echo "  - 앞 4자리: ${MATCH_GIT_PASSWORD:0:4}"
          echo "  - 뒤 4자리: ${MATCH_GIT_PASSWORD: -4}"
          
          # 현재 디렉토리 및 fastlane 디렉토리 내용 확인
          echo "📁 현재 디렉토리: $(pwd)"
          echo "📁 fastlane 디렉토리 내용:"
          ls -la fastlane/
          
          echo "✅ Fastlane Match 설정 준비 완료 (beta lane에서 인증서 동기화 실행)"
          
      # 11단계: DerivedData 완전 정리 (빌드 안정성 향상)
      - name: Clean DerivedData Before Build
        working-directory: pickplay
        run: |
          echo "🧹 DerivedData 완전 정리 중..."
          # Xcode DerivedData 정리
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          # Xcode 캐시 정리
          rm -rf ~/Library/Caches/com.apple.dt.Xcode/*
          # iOS Device Support 정리
          rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport/*
          # Archives 정리
          rm -rf ~/Library/Developer/Xcode/Archives/*
          # 프로젝트 내 DerivedData 정리
          cd ios
          rm -rf build/
          rm -rf DerivedData/
          cd ..
          echo "✅ DerivedData 정리 완료"
          
          # Codegen 디렉토리 및 더미 파일 재생성 (build/ 삭제 후)
          echo "📁 Codegen 디렉토리 및 더미 파일 재생성 중..."
          mkdir -p ios/build/generated/ios
          
          # 1. RCTAppDependencyProvider.h 생성
          touch ios/build/generated/ios/RCTAppDependencyProvider.h
          
          # 2. lottiereactnative 디렉토리 및 더미 파일 생성
          mkdir -p ios/build/generated/ios/react/renderer/components/lottiereactnative
          touch ios/build/generated/ios/react/renderer/components/lottiereactnative/States.h
          touch ios/build/generated/ios/react/renderer/components/lottiereactnative/ShadowNodes.h
          touch ios/build/generated/ios/react/renderer/components/lottiereactnative/RCTComponentViewHelpers.h
          touch ios/build/generated/ios/react/renderer/components/lottiereactnative/Props.h
          touch ios/build/generated/ios/react/renderer/components/lottiereactnative/EventEmitters.h
          touch ios/build/generated/ios/react/renderer/components/lottiereactnative/ComponentDescriptors.h
          echo "✅ lottiereactnative 더미 파일 6개 생성 완료"
          
          # 2.5. RNCWebViewSpec 디렉토리 및 더미 파일 생성
          mkdir -p ios/build/generated/ios/react/renderer/components/RNCWebViewSpec
          touch ios/build/generated/ios/react/renderer/components/RNCWebViewSpec/States.h
          touch ios/build/generated/ios/react/renderer/components/RNCWebViewSpec/ShadowNodes.h
          touch ios/build/generated/ios/react/renderer/components/RNCWebViewSpec/RCTComponentViewHelpers.h
          touch ios/build/generated/ios/react/renderer/components/RNCWebViewSpec/Props.h
          touch ios/build/generated/ios/react/renderer/components/RNCWebViewSpec/EventEmitters.h
          touch ios/build/generated/ios/react/renderer/components/RNCWebViewSpec/ComponentDescriptors.h
          echo "✅ RNCWebViewSpec 더미 파일 6개 생성 완료"
          
          # 2.7. rngesturehandler_codegen 디렉토리 및 더미 파일 생성
          mkdir -p ios/build/generated/ios/react/renderer/components/rngesturehandler_codegen
          touch ios/build/generated/ios/react/renderer/components/rngesturehandler_codegen/States.h
          touch ios/build/generated/ios/react/renderer/components/rngesturehandler_codegen/ShadowNodes.h
          touch ios/build/generated/ios/react/renderer/components/rngesturehandler_codegen/RCTComponentViewHelpers.h
          touch ios/build/generated/ios/react/renderer/components/rngesturehandler_codegen/Props.h
          touch ios/build/generated/ios/react/renderer/components/rngesturehandler_codegen/EventEmitters.h
          touch ios/build/generated/ios/react/renderer/components/rngesturehandler_codegen/ComponentDescriptors.h
          echo "✅ rngesturehandler_codegen 더미 파일 6개 생성 완료"
          
          # 3. 기타 Codegen 디렉토리 생성 (Optional - 향후 에러 방지)
          codegen_dirs=(
            "react/renderer/components/reanimated"
            "react/renderer/components/workletscore"
            "react/renderer/components/safeareacontext"
            "react/renderer/components/googlemobileads"
            "react/renderer/components/rnscreens"
          )
          
          for dir in "${codegen_dirs[@]}"; do
            mkdir -p "ios/build/generated/ios/$dir"
            echo "✅ Codegen 디렉토리 생성: ios/build/generated/ios/$dir"
          done
          
          echo "✅ Codegen 디렉토리 및 더미 파일 재생성 완료"
      
      # 12단계: Fastlane으로 빌드 및 배포 (Match 사용)
      - name: Build and Deploy with Fastlane Match
        working-directory: pickplay
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_PASSWORD: ${{ secrets.MATCH_GIT_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          echo "🚀 Fastlane Match로 빌드 및 배포 시작..."
          
          # Codegen 디렉토리 재생성 (DerivedData 정리 후)
          echo "📁 Codegen 디렉토리 재생성 중..."
          mkdir -p ios/build/generated/ios
          
          codegen_dirs=(
            "react/renderer/components/lottiereactnative"
            "react/renderer/components/reanimated"
            "react/renderer/components/workletscore"
            "react/renderer/components/safeareacontext"
            "react/renderer/components/googlemobileads"
            "react/renderer/components/rngesturehandler"
            "react/renderer/components/rnscreens"
          )
          
          for dir in "${codegen_dirs[@]}"; do
            mkdir -p "ios/build/generated/ios/$dir"
            echo "✅ Codegen 디렉토리 생성: ios/build/generated/ios/$dir"
          done
          
          echo "✅ Codegen 디렉토리 재생성 완료"
          
          # ExportOptions.plist 파일 동적 생성
          echo "📄 ExportOptions.plist 파일 동적 생성 중..."
          mkdir -p ios
          echo '<?xml version="1.0" encoding="UTF-8"?>' > ios/ExportOptions.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ios/ExportOptions.plist
          echo '<plist version="1.0">' >> ios/ExportOptions.plist
          echo '<dict>' >> ios/ExportOptions.plist
          echo '	<key>method</key>' >> ios/ExportOptions.plist
          echo '	<string>app-store</string>' >> ios/ExportOptions.plist
          echo '	<key>teamID</key>' >> ios/ExportOptions.plist
          echo "	<string>$APPLE_TEAM_ID</string>" >> ios/ExportOptions.plist
          echo '	<key>uploadBitcode</key>' >> ios/ExportOptions.plist
          echo '	<false/>' >> ios/ExportOptions.plist
          echo '	<key>uploadSymbols</key>' >> ios/ExportOptions.plist
          echo '	<true/>' >> ios/ExportOptions.plist
          echo '	<key>compileBitcode</key>' >> ios/ExportOptions.plist
          echo '	<false/>' >> ios/ExportOptions.plist
          echo '	<key>stripSwiftSymbols</key>' >> ios/ExportOptions.plist
          echo '	<true/>' >> ios/ExportOptions.plist
          echo '	<key>thinning</key>' >> ios/ExportOptions.plist
          echo '	<string>&lt;none&gt;</string>' >> ios/ExportOptions.plist
          echo '</dict>' >> ios/ExportOptions.plist
          echo '</plist>' >> ios/ExportOptions.plist
          chmod 644 ios/ExportOptions.plist
          echo "✅ ExportOptions.plist 파일 동적 생성 완료"
          
          # Fastlane Match를 사용한 빌드 실행 (pickplay 디렉토리에서 실행, fastlane/Fastfile 사용)
          fastlane beta
          
          echo "✅ 빌드 및 TestFlight 업로드 완료!"
          
      # 11단계: 빌드 상태 확인 (에러 처리)
      - name: Build Status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ 빌드 성공! TestFlight에 업로드되었습니다."
          else
            echo "❌ 빌드 실패! 로그를 확인해주세요."
            
            # 상세 로그 출력
            echo "================================================"
            echo "빌드 로그 파일 위치 확인"
            echo "================================================"
            if [ -f ~/Library/Logs/gym/PickPlay-PickPlay.log ]; then
              echo "📋 로그 파일의 마지막 100줄:"
              tail -100 ~/Library/Logs/gym/PickPlay-PickPlay.log
            fi
            
            if [ -d ~/Library/Developer/Xcode/Archives ]; then
              echo "📦 Archive 파일들:"
              ls -lah ~/Library/Developer/Xcode/Archives/
            fi
            
            exit 1
          fi