name: iOS Build and Deploy to TestFlight

on:
  push:
    branches: [main, release]
  workflow_dispatch: # 수동 실행 가능

jobs:
  ios-build-and-deploy:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean
        
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          
      - name: Build iOS
        run: |
          cd ios
          xcodebuild -workspace PickPlay.xcworkspace -scheme PickPlay -configuration Release -destination generic/platform=iOS -archivePath PickPlay.xcarchive archive DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}
          
      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive -archivePath PickPlay.xcarchive -exportPath . -exportOptionsPlist ExportOptions.plist DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}
          
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ios/PickPlay.ipa
          issuer-id: ${{ secrets.APPLE_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_APP_ID }}
          api-private-key: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          
      - name: Build Status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ iOS 빌드 및 TestFlight 제출 성공!"
          else
            echo "❌ iOS 빌드 또는 TestFlight 제출 실패"
            exit 1
          fi
