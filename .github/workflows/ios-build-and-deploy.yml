name: iOS Build (Dev Client → TestFlight)

on:
  push:
    branches: [main, release]
  workflow_dispatch:

jobs:
  # 1단계: Dev Client 빌드 (선행)
  ios-dev-client:
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      build-success: ${{ job.status == 'success' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Setup Node.js (cache lockfile anywhere)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Write App Store Connect API key to file
        env:
          ASC_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [ -z "$ASC_P8_BASE64" ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 secret가 비어 있습니다." && exit 1
          fi

          export KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"

          python3 <<'PY'
          import os, base64
          key_base64 = os.environ['ASC_P8_BASE64']
          key = base64.b64decode(key_base64).decode('utf-8')
          path = os.environ['KEY_PATH']
          with open(path, 'w', encoding='utf-8') as f:
              f.write(key)
          PY

          if [ ! -s "$KEY_PATH" ]; then
            echo "::error::AuthKey 파일 생성 실패 (파일이 비어 있거나 존재하지 않음)" && exit 1
          fi

          chmod 600 "$KEY_PATH"
          ls -l "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV

      - name: Setup Ruby & tools
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Fastlane/CocoaPods/xcodeproj
        run: |
          gem install fastlane --no-document
          gem install cocoapods --no-document
          gem install xcodeproj --no-document

      - name: Detect project dir
        run: |
          if [ -f ./pickplay/ios/Podfile ]; then
            echo "PROJ_DIR=pickplay" >> $GITHUB_ENV
          elif [ -f ./ios/Podfile ]; then
            echo "PROJ_DIR=." >> $GITHUB_ENV
          else
            echo "::error::ios/Podfile not found"; exit 1
          fi
          echo "Detected PROJ_DIR=$PROJ_DIR"

      - name: Clean caches (clean build)
        run: |
          rm -rf "$PROJ_DIR/node_modules"
          rm -rf "$PROJ_DIR/ios/Pods" "$PROJ_DIR/ios/Podfile.lock" "$PROJ_DIR/ios/build"
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          echo "✅ Clean build: 모든 Pods 및 빌드 아티팩트 제거 완료"

      - name: Install JS deps (npm ci, no dev deps)
        run: |
          cd "$PROJ_DIR"
          if [ -f package-lock.json ]; then
            npm ci --omit=dev --legacy-peer-deps
          else
            echo "::warning::package-lock.json not found; running npm install"
            npm install --omit=dev --legacy-peer-deps
          fi

      - name: Align RN/Expo package versions (expo install --fix)
        run: |
          cd "$PROJ_DIR"
          echo "📦 Running expo install --fix..."
          BEFORE=$(cat package.json 2>/dev/null | grep -E '"(react-native|expo)"' | head -2 || echo "")
          npx expo install --fix --no-interactive || true
          AFTER=$(cat package.json 2>/dev/null | grep -E '"(react-native|expo)"' | head -2 || echo "")
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::warning::expo install --fix changed package versions:"
            echo "Before: $BEFORE"
            echo "After: $AFTER"
          else
            echo "✅ No version changes detected"
          fi

      - name: Install RN autolinking CLI (prod)
        run: |
          cd "$PROJ_DIR"
          npm i --save --legacy-peer-deps \
            @react-native-community/cli \
            @react-native-community/cli-platform-ios \
            expo-modules-autolinking

      - name: Sync iOS native config (Expo prebuild)
        env:
          EXPO_NO_INTERACTIVE: "1"
        run: |
          cd "$PROJ_DIR"
          echo "🛠  Expo prebuild (ios)로 Info.plist 및 native 설정을 동기화합니다..."
          npx expo prebuild --platform ios --no-install --non-interactive
          # Podfile은 레포지토리 버전을 유지 (커스텀 의존성 유지)
          git checkout -- ios/Podfile || true
          echo "✅ Expo prebuild 완료"

      - name: Ensure AdMob app id injected into Info.plist
        run: |
          cd "$PROJ_DIR"
          INFO_PLIST="ios/pickplay/Info.plist"
          if [ ! -f "$INFO_PLIST" ]; then
            echo "::error::Info.plist not found at $INFO_PLIST"
            exit 1
          fi
          GAD_APP_ID=$(node -e "const config=require('./app.config.js'); const val=config?.expo?.ios?.infoPlist?.GADApplicationIdentifier; if(!val){process.exit(1);} process.stdout.write(val);" 2>/dev/null || true)
          if [ -z "$GAD_APP_ID" ]; then
            echo "::error::app.config.js에서 GADApplicationIdentifier 값을 찾을 수 없습니다."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $GAD_APP_ID" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $GAD_APP_ID" "$INFO_PLIST"
          CHECK_ID=$(/usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$INFO_PLIST" 2>/dev/null || true)
          if [ "$CHECK_ID" != "$GAD_APP_ID" ]; then
            echo "::error::Info.plist에 GADApplicationIdentifier 설정에 실패했습니다."
            exit 1
          fi
          echo "✅ Info.plist에 GADApplicationIdentifier 설정 완료: $CHECK_ID"

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJ_DIR }}/ios/Pods
            ${{ env.PROJ_DIR }}/ios/Podfile.lock
          key: pods-clear-${{ hashFiles(format('{0}/ios/Podfile.lock', env.PROJ_DIR)) }}

      - name: Clean CocoaPods Cache
        run: |
          pod cache clean --all
          echo "✅ CocoaPods cache cleaned."

      - name: Install CocoaPods
        run: |
          cd "$PROJ_DIR/ios"
          pod install --repo-update

      - name: Fastlane dev_client
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_PASSWORD: ${{ secrets.MATCH_GIT_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BRANCH: master
          KEYCHAIN_PASSWORD: actions
        run: |
          cd "$PROJ_DIR"
          if [ -f Gemfile ]; then
            bundle exec fastlane ios dev_client
          else
            fastlane ios dev_client
          fi

      - name: Upload Dev Client IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-client-ipa
          path: |
            ${{ env.PROJ_DIR }}/*.ipa
          retention-days: 30
        if: success()
        continue-on-error: true

      - name: Dev Client build success
        run: |
          echo "✅ Dev Client 빌드 성공"
