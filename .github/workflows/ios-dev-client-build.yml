name: iOS Dev Client Build

on:
  workflow_dispatch:
  push:
    branches: [main, release]
    paths:
      - 'pickplay/app/**'
      - 'pickplay/app.config.js'
      - 'pickplay/app.json'
      - 'pickplay/package.json'
      - 'pickplay/fastlane/**'
      - 'pickplay/GoogleService-Info.plist'
      - '.github/workflows/ios-dev-client-build.yml'

jobs:
  ios-dev-client:
    runs-on: macos-14
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Setup Node.js (cache lockfile anywhere)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      # Save p8 key to temporary file for Fastlane
      - name: Write App Store Connect API key to file
        env:
          ASC_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_P8" > "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV

      - name: Setup Ruby & tools
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Fastlane/CocoaPods/xcodeproj
        run: |
          gem install fastlane --no-document
          gem install cocoapods --no-document
          gem install xcodeproj --no-document

      # 프로젝트 디렉토리 감지
      - name: Detect project dir
        run: |
          if [ -f ./pickplay/ios/Podfile ]; then
            echo "PROJ_DIR=pickplay" >> $GITHUB_ENV
          elif [ -f ./ios/Podfile ]; then
            echo "PROJ_DIR=." >> $GITHUB_ENV
          else
            echo "::error::ios/Podfile not found"; exit 1
          fi
          echo "Detected PROJ_DIR=$PROJ_DIR"

      # ✅ 캐시 및 빌드 잔재 완전 삭제
      - name: Clean caches (clean build)
        run: |
          rm -rf "$PROJ_DIR/node_modules"
          rm -rf "$PROJ_DIR/ios/Pods" "$PROJ_DIR/ios/Podfile.lock" "$PROJ_DIR/ios/build"
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          echo "✅ Clean build: 모든 Pods 및 빌드 아티팩트 제거 완료"

      - name: Install JS deps (npm ci, no dev deps)
        run: |
          cd "$PROJ_DIR"
          if [ -f package-lock.json ]; then
            npm ci --omit=dev --legacy-peer-deps
          else
            echo "::warning::package-lock.json not found; running npm install"
            npm install --omit=dev --legacy-peer-deps
          fi

      - name: Align RN/Expo package versions (expo install --fix)
        run: |
          cd "$PROJ_DIR"
          echo "📦 Running expo install --fix..."
          BEFORE=$(cat package.json 2>/dev/null | grep -E '"(react-native|expo)"' | head -2 || echo "")
          npx expo install --fix --no-interactive || true
          AFTER=$(cat package.json 2>/dev/null | grep -E '"(react-native|expo)"' | head -2 || echo "")
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::warning::expo install --fix changed package versions:"
            echo "Before: $BEFORE"
            echo "After: $AFTER"
          else
            echo "✅ No version changes detected"
          fi

      - name: Install RN autolinking CLI (prod)
        run: |
          cd "$PROJ_DIR"
          npm i --save --legacy-peer-deps \
            @react-native-community/cli \
            @react-native-community/cli-platform-ios \
            expo-modules-autolinking

      # Expo prebuild 실행 (app.json의 googleServicesFile 설정 적용)
      - name: Ensure iOS native project (Expo prebuild with clean)
        run: |
          cd "$PROJ_DIR"
          echo "🛠  Running Expo prebuild to apply app.json changes (including googleServicesFile)..."
          npx expo prebuild --platform ios --no-install --clean
          git checkout -- ios/Podfile || true # ✅ Podfile 되살리기
          echo "✅ Expo prebuild 완료 - GoogleService-Info.plist가 ios/에 포함되었는지 확인하세요"

      - name: Verify GoogleService-Info.plist location
        run: |
          cd "$PROJ_DIR"
          echo "🔍 GoogleService-Info.plist 위치 확인 중..."
          echo "현재 디렉토리: $(pwd)"
          echo ""
          echo "=== 프로젝트 루트에서 검색 ==="
          if [ -f "GoogleService-Info.plist" ]; then
            echo "✅ 프로젝트 루트에 GoogleService-Info.plist 발견"
            echo "파일 크기: $(stat -f%z GoogleService-Info.plist 2>/dev/null || stat -c%s GoogleService-Info.plist 2>/dev/null) bytes"
            echo "Bundle ID: $(grep -A1 '<key>BUNDLE_ID</key>' GoogleService-Info.plist | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/')"
          else
            echo "❌ 프로젝트 루트에 GoogleService-Info.plist 없음"
          fi
          echo ""
          echo "=== ios 디렉토리에서 검색 ==="
          find ios -name "GoogleService-Info.plist" -type f 2>/dev/null || echo "ios 디렉토리에 없음"
          echo ""
          echo "=== expo prebuild 후 예상 위치 확인 ==="
          if [ -f "ios/pickplay/GoogleService-Info.plist" ]; then
            echo "✅ ios/pickplay/GoogleService-Info.plist 발견 (올바른 위치)"
            echo "파일 크기: $(stat -f%z ios/pickplay/GoogleService-Info.plist 2>/dev/null || stat -c%s ios/pickplay/GoogleService-Info.plist 2>/dev/null) bytes"
            echo "Bundle ID: $(grep -A1 '<key>BUNDLE_ID</key>' ios/pickplay/GoogleService-Info.plist | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/')"
            echo "Project ID: $(grep -A1 '<key>PROJECT_ID</key>' ios/pickplay/GoogleService-Info.plist | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/')"
          else
            echo "❌ ios/pickplay/GoogleService-Info.plist 없음 (Config Plugin 확인 필요)"
            echo "디렉토리 구조:"
            ls -la ios/pickplay/ 2>/dev/null || echo "ios/pickplay 디렉토리 없음"
          fi

      - name: Debug iOS folder
        run: |
          cd "$PROJ_DIR/ios"
          echo "== ios contents ==" && ls -la
          echo "== Xcode projects ==" && ls -1 *.xcodeproj || true

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJ_DIR }}/ios/Pods
            ${{ env.PROJ_DIR }}/ios/Podfile.lock
          key: pods-clear-${{ hashFiles(format('{0}/ios/Podfile.lock', env.PROJ_DIR)) }}

      - name: Clean CocoaPods Cache
        run: |
          pod cache clean --all
          echo "✅ CocoaPods cache cleaned."

      - name: Ensure CocoaPods Specs repo (fallback)
        run: |
          cd "$PROJ_DIR"
          echo "🔧 Ensuring CocoaPods Specs repo available..."
          # 기존 trunk 레포 제거 (있으면)
          pod repo remove trunk 2>/dev/null || true
          # CDN 레포 추가 시도 (실패해도 계속)
          pod repo add-cdn trunk https://cdn.cocoapods.org/ 2>/dev/null || true
          # GitHub Specs 레포로 trunk 추가 (CDN 실패 시 fallback)
          pod repo add trunk https://github.com/CocoaPods/Specs.git || true
          echo "✅ CocoaPods Specs repo 준비 완료"
          pod repo list

      - name: Install CocoaPods
        run: |
          cd "$PROJ_DIR/ios"
          # trunk 레포가 제대로 설정되었는지 확인
          if ! pod repo list | grep -q "trunk"; then
            echo "❌ trunk 레포가 없습니다. GitHub Specs 레포로 추가 중..."
            pod repo remove trunk 2>/dev/null || true
            pod repo add trunk https://github.com/CocoaPods/Specs.git
          fi
          # repo-update 없이 설치 (이미 레포 준비 완료)
          pod install

      - name: Verify React Native Codegen files
        run: |
          cd "$PROJ_DIR"
          echo "🔍 Checking if React Native Codegen files were generated..."
          CODEGEN_DIR="$PROJ_DIR/ios/build/generated/ios"
          if [ ! -d "$CODEGEN_DIR" ]; then
            echo "::warning::Codegen directory not found: $CODEGEN_DIR"
            echo "Attempting to create Codegen directory structure..."
            mkdir -p "$CODEGEN_DIR/react/renderer/components"
            echo "⚠️ Codegen files may be generated during build"
          else
            echo "✅ Codegen directory found: $CODEGEN_DIR"
            FILE_COUNT=$(find "$CODEGEN_DIR" -type f | wc -l)
            echo "Found $FILE_COUNT Codegen files"
            if [ "$FILE_COUNT" -eq 0 ]; then
              echo "::warning::Codegen directory exists but contains no files"
            fi
          fi

      - name: Verify post_install cleaned BoringSSL-GRPC
        run: |
          cd "$PROJ_DIR/ios"
          if grep -R --line-number --fixed-strings " -G" Pods/Pods.xcodeproj/project.pbxproj; then
            echo "::error::Found -G in Pods project after post_install"
            exit 1
          fi
          echo "✅ No -G flags remain in Pods project"

      - name: Verify C++ standard is gnu++20 for all Pods
        run: |
          cd "$PROJ_DIR/ios"
          echo "🔍 Verifying C++20 standard is set for all Pod targets..."
          if [ ! -f "Pods/Pods.xcodeproj/project.pbxproj" ]; then
            echo "::warning::Pods project not found; skipping C++ standard check"
            exit 0
          fi

          FILE="Pods/Pods.xcodeproj/project.pbxproj"
          
          # Check if gnu++20 or c++20 exists anywhere
          HAS_CXX20=$(grep -iE "gnu\+\+20|c\+\+20" "$FILE" || true)
          
          if [ -z "$HAS_CXX20" ]; then
            echo "::error::No C++20 standard (gnu++20 or c++20) found in Pods project."
            exit 1
          fi

          CXX20_COUNT=$(echo "$HAS_CXX20" | grep -icE "(gnu\+\+20|c\+\+20)" || echo "0")
          echo "✅ Detected C++20 standard in Pods project ($CXX20_COUNT occurrences)"

      - name: Fastlane dev_client
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_PASSWORD: ${{ secrets.MATCH_GIT_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BRANCH: master
          KEYCHAIN_PASSWORD: actions
        run: |
          cd "$PROJ_DIR"
          if [ -f Gemfile ]; then
            bundle exec fastlane ios dev_client
          else
            fastlane ios dev_client
          fi

      # 빌드 아티팩트 업로드 (IPA 파일)
      - name: Find IPA file location
        id: find_ipa
        run: |
          cd "$PROJ_DIR"
          echo "🔍 IPA 파일 검색 중..."
          echo "현재 디렉토리: $(pwd)"
          echo "PROJ_DIR: $PROJ_DIR"
          
          # 프로젝트 루트에서 검색 (Fastlane이 REPO_ROOT에 생성)
          if ls "$PROJ_DIR"/*.ipa 2>/dev/null | head -1 | read IPA_PATH; then
            echo "✅ IPA 파일 발견 (프로젝트 루트): $IPA_PATH"
            echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
          # 상위 디렉토리에서 검색 (Fastlane이 프로젝트 루트에 생성하는 경우)
          elif ls ../*.ipa 2>/dev/null | head -1 | read IPA_PATH; then
            echo "✅ IPA 파일 발견 (상위 디렉토리): $IPA_PATH"
            echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
          # 전체 검색
          else
            IPA_PATH=$(find "$PROJ_DIR" -name "*.ipa" -type f 2>/dev/null | head -1)
            if [ -n "$IPA_PATH" ]; then
              echo "✅ IPA 파일 발견 (전체 검색): $IPA_PATH"
              echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
            else
              # 상위 디렉토리 전체 검색
              IPA_PATH=$(find .. -name "*.ipa" -type f 2>/dev/null | head -1)
              if [ -n "$IPA_PATH" ]; then
                echo "✅ IPA 파일 발견 (상위 전체 검색): $IPA_PATH"
                echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
              else
                echo "❌ IPA 파일을 찾을 수 없습니다"
                echo "현재 디렉토리 내용:"
                ls -la "$PROJ_DIR" || true
                echo "상위 디렉토리 내용:"
                ls -la .. || true
                exit 1
              fi
            fi
          fi
          
          # IPA 파일 정보 출력
          if [ -n "$IPA_PATH" ]; then
            echo "📦 IPA 파일 정보:"
            ls -lh "$IPA_PATH"
            echo "ipa_dir=$(dirname "$IPA_PATH")" >> $GITHUB_OUTPUT
            echo "ipa_filename=$(basename "$IPA_PATH")" >> $GITHUB_OUTPUT
          fi
          
      # IPA 파일에서 GoogleService-Info.plist 포함 여부 확인
      - name: Verify GoogleService-Info.plist in IPA
        if: success() && steps.find_ipa.outputs.ipa_path != ''
        run: |
          cd "$PROJ_DIR"
          IPA_PATH="${{ steps.find_ipa.outputs.ipa_path }}"
          echo "🔍 IPA 파일에서 GoogleService-Info.plist 확인 중..."
          echo "IPA 경로: $IPA_PATH"
          
          # 임시 디렉토리 생성
          EXTRACT_DIR=$(mktemp -d)
          echo "임시 디렉토리: $EXTRACT_DIR"
          
          # IPA 압축 해제
          unzip -q "$IPA_PATH" -d "$EXTRACT_DIR" || echo "⚠️ IPA 압축 해제 실패"
          
          # GoogleService-Info.plist 검색
          if [ -d "$EXTRACT_DIR/Payload/pickplay.app" ]; then
            echo "✅ Payload/pickplay.app 디렉토리 발견"
            if [ -f "$EXTRACT_DIR/Payload/pickplay.app/GoogleService-Info.plist" ]; then
              echo "✅ GoogleService-Info.plist가 IPA 번들에 포함되어 있음!"
              echo "파일 크기: $(stat -f%z "$EXTRACT_DIR/Payload/pickplay.app/GoogleService-Info.plist" 2>/dev/null || stat -c%s "$EXTRACT_DIR/Payload/pickplay.app/GoogleService-Info.plist" 2>/dev/null) bytes"
              echo "Bundle ID: $(grep -A1 '<key>BUNDLE_ID</key>' "$EXTRACT_DIR/Payload/pickplay.app/GoogleService-Info.plist" | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/')"
            else
              echo "❌ GoogleService-Info.plist가 IPA 번들에 포함되지 않음!"
              echo "앱 번들 내용:"
              ls -la "$EXTRACT_DIR/Payload/pickplay.app" | head -20
            fi
          else
            echo "⚠️ Payload/pickplay.app 디렉토리를 찾을 수 없음"
            echo "압축 해제된 내용:"
            ls -la "$EXTRACT_DIR" || true
          fi
          
          # 임시 디렉토리 정리
          rm -rf "$EXTRACT_DIR"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-client-ipa
          path: ${{ steps.find_ipa.outputs.ipa_path }}
          retention-days: 90
          if-no-files-found: error
        if: success() && steps.find_ipa.outputs.ipa_path != ''

      - name: Success message
        run: |
          echo "✅ Dev Client 빌드 완료!"
          echo "📱 Actions 탭에서 IPA 파일을 다운로드하세요."
          echo "📱 설치 후 'expo start --dev-client'로 Metro 서버를 실행하세요."

