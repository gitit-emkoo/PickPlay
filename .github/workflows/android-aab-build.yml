name: Android AAB Build

on:
  workflow_dispatch:

jobs:
  android-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      # 프로젝트 디렉토리 확인
      - name: Detect project dir
        id: detect_dir
        run: |
          if [ -d "pickplay/pickplay" ]; then
            PROJ_DIR="pickplay/pickplay"
          elif [ -d "pickplay" ]; then
            PROJ_DIR="pickplay"
          else
            PROJ_DIR="."
          fi
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV
          echo "project_dir=$PROJ_DIR" >> $GITHUB_OUTPUT
          echo "✅ Detected project directory: $PROJ_DIR"

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Clean caches
      - name: Clean caches
        run: |
          cd "$PROJ_DIR"
          echo "🧹 Cleaning caches..."
          rm -rf node_modules/.cache 2>/dev/null || true
          rm -rf .expo 2>/dev/null || true
          rm -rf android/build 2>/dev/null || true
          rm -rf android/app/build 2>/dev/null || true
          echo "✅ Caches cleaned"

      # Install JS deps
      - name: Install JS deps
        run: |
          cd "$PROJ_DIR"
          echo "📦 Installing JavaScript dependencies..."
          npm ci --include=dev --legacy-peer-deps
          echo "✅ JavaScript dependencies installed"

      # Align RN/Expo package versions
      - name: Align RN/Expo package versions
        run: |
          cd "$PROJ_DIR"
          echo "🔧 Aligning React Native/Expo package versions..."
          npx expo install --fix || echo "⚠️ expo install --fix failed, continuing..."
          echo "✅ Package versions aligned"

      # Ensure Android native project
      - name: Ensure Android native project
        run: |
          cd "$PROJ_DIR"
          echo "🔧 Running expo prebuild --clean --platform android..."
          npx expo prebuild --clean --platform android
          echo "✅ Expo prebuild completed"

      # Verify google-services.json location
      - name: Verify google-services.json location
        run: |
          cd "$PROJ_DIR"
          echo "🔍 Checking google-services.json location..."
          if [ -f "android/app/google-services.json" ]; then
            echo "✅ google-services.json found in android/app/"
            ls -lh android/app/google-services.json
          else
            echo "⚠️ google-services.json not found in android/app/"
            find android -name "google-services.json" 2>/dev/null || echo "File not found"
          fi

      # Setup Android signing (if keystore exists in secrets)
      - name: Setup Android signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cd "$PROJ_DIR/android/app"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "✅ Keystore file created"
        continue-on-error: true

      # Build AAB
      - name: Build AAB
        run: |
          cd "$PROJ_DIR/android"
          echo "🔨 Building AAB (Android App Bundle)..."
          
          # Gradle wrapper 실행 권한 부여
          chmod +x gradlew
          
          # Release AAB 빌드
          ./gradlew bundleRelease
          echo "✅ AAB build completed"

      # Find AAB file
      - name: Find AAB file
        id: find_aab
        run: |
          cd "$PROJ_DIR"
          echo "🔍 AAB 파일 검색 중..."
          
          AAB_PATH=$(find android/app/build/outputs/bundle -name "*.aab" -type f 2>/dev/null | head -1)
          
          if [ -z "$AAB_PATH" ]; then
            echo "❌ AAB 파일을 찾을 수 없습니다"
            echo "android/app/build/outputs/bundle 디렉토리 내용:"
            ls -la android/app/build/outputs/bundle/ 2>/dev/null || echo "Directory not found"
            exit 1
          fi
          
          echo "✅ AAB 파일 발견: $AAB_PATH"
          echo "📦 AAB 파일 정보:"
          ls -lh "$AAB_PATH"
          
          # 절대 경로로 변환
          if [[ "$AAB_PATH" != /* ]]; then
            AAB_PATH=$(realpath "$AAB_PATH" || echo "$(pwd)/$AAB_PATH")
          fi
          
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT
          echo "aab_filename=$(basename "$AAB_PATH")" >> $GITHUB_OUTPUT

      # Upload AAB artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pickplay-aab
          path: ${{ steps.find_aab.outputs.aab_path }}
          retention-days: 90
          if-no-files-found: error

      - name: Success message
        run: |
          echo "✅ Android AAB 빌드 완료!"
          echo "📱 AAB 파일이 아티팩트로 업로드되었습니다."
          echo "📱 Google Play Console에 업로드할 수 있습니다."

