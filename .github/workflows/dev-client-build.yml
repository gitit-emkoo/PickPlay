name: iOS Dev Client Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '선택 사항: 체크아웃할 브랜치/태그 (비워두면 기본)'
        required: false
  push:
    branches:
      - release

jobs:
  build-dev-client:
    runs-on: macos-14
    timeout-minutes: 90

    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
      MATCH_GIT_PASSWORD: ${{ secrets.MATCH_GIT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Detect project directory
        id: detect_dir
        run: |
          if [ -d "pickplay/pickplay" ]; then
            PROJ_DIR="pickplay/pickplay"
          elif [ -d "pickplay" ]; then
            PROJ_DIR="pickplay"
          else
            PROJ_DIR="."
          fi
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV
          echo "project_dir=$PROJ_DIR" >> $GITHUB_OUTPUT
          echo "✅ Project directory detected: $PROJ_DIR"

      - name: Write App Store Connect API key to file
        env:
          ASC_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_P8" > "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV

      - name: Install JavaScript dependencies
        run: |
          cd "$PROJ_DIR"
          npm ci --include=dev --legacy-peer-deps

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install fastlane and CocoaPods
        run: |
          cd "$PROJ_DIR"
          if [ -f Gemfile ]; then
            bundle install
          else
            gem install fastlane -NV
            sudo gem install cocoapods -NV
          fi
          pod --version

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build iOS Dev Client (fastlane ios dev_client)
        run: |
          cd "$PROJ_DIR"
          fastlane ios dev_client

      - name: Upload Dev Client IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pickplay-dev-client-ipa
          path: ${{ env.PROJ_DIR }}/*.ipa
          retention-days: 7
          if-no-files-found: error

